/* ==================================================
   OUTILS
================================================== */

function normalizeText(text){

  return String(text || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[-'’]/g," ")
    .replace(/\s+/g," ");

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


function escapeODSQL(value){

  return String(value || "")
    .replaceAll("\\","\\\\")
    .replaceAll('"','\\"');

}

  document
    .querySelectorAll(".screen")

}

/* ==================================================
   API PAGINEE
================================================== */

async function fetchAllRecords(where){

  let records = [];

  let offset = 0;

  const limit = 100;


  while(true){

    const p =
      new URLSearchParams();


    p.set(
      "where",
      where
    );


    p.set(
      "limit",
      String(limit)
    );


    p.set(
      "offset",
      String(offset)
    );


    const response =
      await fetch(
        API + "?" + p.toString()
      );


    if(!response.ok){

      throw new Error(
        "Erreur API"
      );

    }


    const data =
      await response.json();


    const page =
      data.results || [];


    records.push(
      ...page
    );


    if(
      page.length < limit
    ){

      break;

    }


    offset += page.length;


    /*
      Protection contre les très grosses
      requêtes accidentelles.
    */

    if(
      offset >= 9900
    ){

      break;

    }

  }


  return records;

}


/* ==================================================
   LISTES TERRITORIALES DISTINCTES
================================================== */

async function getDistinctTerritories(field){

  const p =
    new URLSearchParams();


  p.set(
    "select",
    field + ",count(*) as nb"
  );


  p.set(
    "group_by",
    field
  );


  p.set(
    "order_by",
    field + " ASC"
  );


  p.set(
    "limit",
    "20000"
  );


  const response =
    await fetch(
      API + "?" + p.toString()
    );


  if(!response.ok){

    throw new Error(
      "Territory API"
    );

  }


  const data =
    await response.json();


  return (data.results || [])

    .map(
      r =>
        String(
          r[field] || ""
        ).trim()
    )

    .filter(Boolean)

    .filter(
      (value,index,array) =>
        array.indexOf(value) === index
    )

    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "fr",
          {
            sensitivity:"base"
          }
        )
    );

}


/* ==================================================
   CACHE TERRITOIRES
================================================== */

async function ensureTerritoriesLoaded(){

  const tasks = [];


  if(!territoryCache.departments){

    tasks.push(

      getDistinctTerritories(
        "libelle_departement"
      )

      .then(
        values =>
          territoryCache.departments =
            values
      )

    );

  }


  if(!territoryCache.academies){

    tasks.push(

      getDistinctTerritories(
        "libelle_academie"
      )

      .then(
        values =>
          territoryCache.academies =
            values
      )

    );

  }


  if(!territoryCache.regions){

    tasks.push(

      getDistinctTerritories(
        "libelle_region"
      )

      .then(
        values =>
          territoryCache.regions =
            values
      )

    );

  }


  if(tasks.length){

    await Promise.all(tasks);

  }

}


/* ==================================================
   FILTRE LOCAL TERRITOIRES
================================================== */

function filterTerritories(
  values,
  query
){

  const q =
    normalizeText(query);


  return (values || [])

    .filter(
      value =>
        normalizeText(value)
        .startsWith(q)
    )

    .slice(0,15);

}


/* ==================================================

================================================== */

input.addEventListener(

    }


    const numeric =
      /^\d+$/.test(value);


    if(
      numeric
      &&
      value.length < 2
    ){

      return;

    }


    if(
      !numeric
      &&
      value.length < 3
    ){

      return;

    }


    /*
      Code postal complet
    */

    if(
      numeric
      &&
      value.length === 5
    ){

      timer =
        setTimeout(
          () => openPostalCode(value),
          150
        );

      return;

    }


    timer =
      setTimeout(
        () => universalSearch(

          numeric
        ),

      );

/* ==================================================
   RECHERCHE UNIVERSELLE
================================================== */

async function universalSearch(
  value,
  numeric
){

  const request =
    ++requestNumber;


  searchStatus.innerHTML =
    '<div class="status">Recherche…</div>';


  try{


    if(!numeric){

      await ensureTerritoriesLoaded();

    }


    const [
      areas,
      directSchools
    ] =
      await Promise.all([

        searchAreas(
          value,
          numeric
        ),

        numeric
          ?
          Promise.resolve([])
          :
          searchSchoolsDirect(value)

      ]);


    if(
      request !==
      requestNumber
    ){

      return;

    }


    let departments = [];

    let academies = [];

    let regions = [];

    let academicRegionResults = [];


    if(!numeric){

      departments =
        filterTerritories(
          territoryCache.departments,
          value
        );


      academies =
        filterTerritories(
          territoryCache.academies,
          value
        );


      regions =
        filterTerritories(
          territoryCache.regions,
          value
        );


      academicRegionResults =
        academicRegions

        .filter(
          region =>
            normalizeText(
              region.name
            )
            .startsWith(
              normalizeText(value)
            )
        )

        .slice(0,15);

    }


    searchStatus.innerHTML = "";


    displayUniversalResults({

      areas,

      directSchools,

      departments,

      academies,

      academicRegions:
        academicRegionResults,

      regions

    });

  }


  catch(error){

    console.error(error);


    searchStatus.innerHTML =
      '<div class="status">' +
      'Impossible d’accéder à l’annuaire.' +
      '</div>';

  }

}


/* ==================================================
   VILLES + CODES POSTAUX
================================================== */

async function searchAreas(
  value,
  numeric
){

  let where;


  if(numeric){

    where =
      'startswith(code_postal,"' +
      escapeODSQL(value) +
      '")';

  }

  else{

    where =
      'suggest(nom_commune,"' +
      escapeODSQL(value) +
      '")';

  }


  const p =
    new URLSearchParams();


  p.set(
    "select",
    "nom_commune,code_postal,count(*) as nb"
  );


  p.set(
    "group_by",
    "nom_commune,code_postal"
  );


  p.set(
    "where",
    where
  );


  p.set(
    "order_by",
    "nom_commune ASC,code_postal ASC"
  );


  p.set(
    "limit",
    "20000"
  );


  const response =
    await fetch(
      API + "?" + p.toString()
    );


  if(!response.ok){

    throw new Error(
      "API"
    );

  }


  const data =
    await response.json();


  const map =
    new Map();


  (data.results || [])
  .forEach(
    r => {

      const city =
        String(
          r.nom_commune || ""
        ).trim();


      const cp =
        String(
          r.code_postal || ""
        ).trim();


      if(
        !city ||
        !cp
      ){

        return;

      }


      if(numeric){

        if(
          !cp.startsWith(value)
        ){

          return;

        }

      }

      else{

        if(
          !normalizeText(city)
          .startsWith(
            normalizeText(value)
          )
        ){

          return;

        }

      }


      const key =
        normalizeText(city);


      if(
        !map.has(key)
      ){

        map.set(
          key,
          {
            city:city,
            cps:new Set()
          }
        );

      }


      map
        .get(key)
        .cps
        .add(cp);

    }
  );


  return Array.from(
    map.values()
  )

  .map(
    x => ({

      city:
        x.city,

      cps:
        Array.from(
          x.cps
        )
        .sort()

    })
  )

  .sort(
    (a,b) =>
      a.city.localeCompare(
        b.city,
        "fr",
        {
          sensitivity:"base"
        }
      )
  );

}


/* ==================================================
   RECHERCHE DIRECTE ETABLISSEMENT

   IMPORTANT :
   PLUS DE LIMITE A 15 RESULTATS
================================================== */

async function searchSchoolsDirect(value){

  const where =

    'search(nom_etablissement,"'

    +

    escapeODSQL(value)

    +

    '")';


  try{


    /*
      Récupération paginée de tous
      les résultats correspondants.
    */

    const records =
      await fetchAllRecords(
        where
      );


    const query =
      normalizeText(value);


    /*
      Vérification locale :
      le nom doit réellement contenir
      le texte saisi.
    */

    const found =
      records.filter(
        s => {

          const name =
            normalizeText(
              s.nom_etablissement
            );


          return name.includes(
            query
          );

        }
      );


    /*
      Dédoublonnage.
    */

    const unique =
      deduplicateSchools(
        found
      );


    /*
      Tri alphabétique.
    */

    unique.sort(
      (a,b) =>

        String(
          a.nom_etablissement || ""
        )

        .localeCompare(

          String(
            b.nom_etablissement || ""
          ),

          "fr",

          {
            sensitivity:"base",
            ignorePunctuation:true
          }

        )

    );


    /*
      AUCUN .slice(0,15)
      → tous les résultats sont conservés.
    */

    return unique;

  }


  catch(error){

    console.error(
      "Erreur recherche établissement :",
      error
    );


    return [];

  }

}


/* ==================================================
   CREATION RUBRIQUE
================================================== */

function appendSection(
  titleText,
  items,
  renderer
){

  if(
    !items ||
    !items.length
  ){

    return;

  }


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "section-label";


  title.textContent =
    titleText;


  resultList.appendChild(
    title
  );


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "list";


  items.forEach(
    item =>
      renderer(
        item,
        box
      )
  );


  resultList.appendChild(
    box
  );

}


/* ==================================================
   AFFICHAGE RECHERCHE UNIVERSELLE
================================================== */

function displayUniversalResults(data){

  resultList.innerHTML = "";


  const total =

    data.directSchools.length

    +

    data.areas.length

    +

    data.departments.length

    +

    data.academies.length

    +

    data.academicRegions.length

    +

    data.regions.length;


  if(!total){

    resultList.innerHTML =
      '<div class="empty">' +
      'Aucun résultat trouvé' +
      '</div>';

    return;

  }


  /* ----------------------------------------------
     ETABLISSEMENTS
  ---------------------------------------------- */

  if(
    data.directSchools.length
  ){

    const count =
      data.directSchools.length;


    appendSection(

      "Établissements — "

      +

      count

      +

      (
        count > 1

        ?

        " résultats"

        :

        " résultat"
      ),

      data.directSchools,

      (s,box) => {


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "item";


        div.innerHTML =

          '<div class="item-title">'

          +

          escapeHTML(
            s.nom_etablissement
            ||
            "Établissement"
          )

          +

          '</div>'

          +

          '<div class="item-sub">'

          +

          escapeHTML(

            [

              s.type_etablissement,

              s.code_postal,

              s.nom_commune

            ]

            .filter(Boolean)

            .join(" · ")

          )

          +

          '</div>';


        div.onclick =
          () =>
            displaySchool(s);


        box.appendChild(
          div
        );

      }

    );

  }


  /* ----------------------------------------------
     VILLES
  ---------------------------------------------- */

  appendSection(

    "Villes",

    data.areas,

    (area,box) => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          area.city
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(
          area.cps.join(" · ")
        )

        +

        '</div>';


      div.onclick =
        () => openCity(
          area.city,
          area.cps
        );


      box.appendChild(
        div
      );

    }

  );


  /* ----------------------------------------------
     DEPARTEMENTS
  ---------------------------------------------- */

  appendSection(

    "Départements",

    data.departments,

    (name,box) => {

      appendTerritoryItem(
        box,
        name,
        "Département",
        "libelle_departement"
      );

    }

  );


  /* ----------------------------------------------
     ACADEMIES
  ---------------------------------------------- */

  appendSection(

    "Académies",

    data.academies,

    (name,box) => {

      appendTerritoryItem(
        box,
        name,
        "Académie",
        "libelle_academie"
      );

    }

  );


  /* ----------------------------------------------
     REGIONS ACADEMIQUES
  ---------------------------------------------- */

  appendSection(

    "Régions académiques",

    data.academicRegions,

    (region,box) => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          region.name
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(
          region.academies.join(" · ")
        )

        +

        '</div>';


      div.onclick =
        () =>
          openAcademicRegion(
            region
          );


      box.appendChild(
        div
      );

    }

  );


  /* ----------------------------------------------
     REGIONS
  ---------------------------------------------- */

  appendSection(

    "Régions",

    data.regions,

    (name,box) => {

      appendTerritoryItem(
        box,
        name,
        "Région",
        "libelle_region"
      );

    }

  );

}


/* ==================================================
   ITEM TERRITOIRE
================================================== */

function appendTerritoryItem(
  box,
  name,
  label,
  field
){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "item";


  div.innerHTML =

    '<div class="item-title">'

    +

    escapeHTML(name)

    +

    '</div>'

    +

    '<div class="item-sub">'

    +

    escapeHTML(label)

    +

    '</div>';


  div.onclick =
    () =>
      openTerritory(
        name,
        field,
        label
      );


  box.appendChild(
    div
  );

}


/* ==================================================
   PREPARATION ECRAN ETABLISSEMENTS
================================================== */

function prepareSchoolScreen(){

  schoolSearchInput.value =
    "";


  updateSchoolClearButton();


  activeFilter =
    "ALL";


  updateFilterButtons();


  document
    .getElementById(
      "schoolList"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "schoolCounter"
    )
    .textContent =
      "";


  document
    .getElementById(
      "schoolStatus"
    )
    .textContent =
      "Chargement des établissements…";


  activate(
    "schoolScreen"
  );

}


/* ==================================================
   OUVERTURE TERRITOIRE
================================================== */

async function openTerritory(
  name,
  field,
  label
){

  document
    .getElementById(
      "selectedArea"
    )
    .textContent =
      name;


  document
    .getElementById(
      "selectedAreaInfo"
    )
    .textContent =
      label;


  prepareSchoolScreen();


  try{


    const records =
      await fetchAllRecords(

        field

        +

        '="'

        +

        escapeODSQL(name)

        +

        '"'

      );


    schools =
      deduplicateSchools(
        records
      );


    sortSchools();


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "";


    applySchoolFilters();

  }


  catch(error){

    console.error(error);


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "Impossible de charger les établissements.";

  }

}


/* ==================================================
   REGION ACADEMIQUE
================================================== */

async function openAcademicRegion(region){

  document
    .getElementById(
      "selectedArea"
    )
    .textContent =
      region.name;


  document
    .getElementById(
      "selectedAreaInfo"
    )
    .textContent =

      "Région académique · "

      +

      region.academies.join(" · ");


  prepareSchoolScreen();


  try{


    let all = [];


    for(
      const academy of
      region.academies
    ){

      const records =
        await fetchAllRecords(

          'libelle_academie="'

          +

          escapeODSQL(
            academy
          )

          +

          '"'

        );


      all.push(
        ...records
      );

    }


    schools =
      deduplicateSchools(
        all
      );


    sortSchools();


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "";


    applySchoolFilters();

  }


  catch(error){

    console.error(error);


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "Impossible de charger les établissements.";

  }

}


/* ==================================================
   FAMILLE DE VILLES
================================================== */

function cityFamilyMatch(
  schoolCity,
  selectedCity
){

  const a =
    normalizeText(
      schoolCity
    );


  const b =
    normalizeText(
      selectedCity
    );


  if(
    a === b
  ){

    return true;

  }


  if(
    b === "PARIS"
    ||
    b === "LYON"
    ||
    b === "MARSEILLE"
  ){

    if(
      a.startsWith(
        b + " "
      )

      &&

      a.includes(
        "ARRONDISSEMENT"
      )
    ){

      return true;

    }

  }


  return false;

}


/* ==================================================
   CHARGEMENT PAR CODES POSTAUX
================================================== */

async function fetchSchoolsForPostalCodes(cps){

  let all = [];


  for(
    const cp of cps
  ){

    const records =
      await fetchAllRecords(

        'code_postal="'

        +

        escapeODSQL(cp)

        +

        '"'

      );


    all.push(
      ...records
    );

  }


  return all;

}


/* ==================================================
   OUVERTURE VILLE
================================================== */

async function openCity(
  city,
  cps
){

  currentCity =
    city;


  currentPostalCodes =
    [...cps];


  document
    .getElementById(
      "selectedArea"
    )
    .textContent =
      city;


  document
    .getElementById(
      "selectedAreaInfo"
    )
    .textContent =
      cps.join(" · ");


  prepareSchoolScreen();


  try{


    const records =
      await fetchSchoolsForPostalCodes(
        cps
      );


    schools =
      deduplicateSchools(

        records.filter(
          s =>

            currentPostalCodes.includes(

              String(
                s.code_postal || ""
              )

            )

            &&

            cityFamilyMatch(

              s.nom_commune,

              city

            )

        )

      );


    sortSchools();


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "";


    applySchoolFilters();

  }


  catch(error){

    console.error(error);


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "Impossible de charger les établissements.";

  }

}


/* ==================================================
   CODE POSTAL COMPLET
================================================== */

async function openPostalCode(cp){

  const request =
    ++requestNumber;


  resultList.innerHTML =
    "";


  searchStatus.innerHTML =
    '<div class="status">' +
    'Chargement des établissements…' +
    '</div>';


  try{


    const records =
      await fetchAllRecords(

        'code_postal="'

        +

        escapeODSQL(cp)

        +

        '"'

      );


    if(
      request !==
      requestNumber
    ){

      return;

    }


    if(
      !records.length
    ){

      searchStatus.innerHTML =
        '<div class="status">' +
        'Aucun établissement trouvé.' +
        '</div>';

      return;

    }


    schools =
      deduplicateSchools(
        records
      );


    sortSchools();


    const cities = [
      ...new Set(

        schools

        .map(
          s => s.nom_commune
        )

        .filter(Boolean)

      )
    ];


    document
      .getElementById(
        "selectedArea"
      )
      .textContent =

        cities.length === 1

        ?

        cities[0]

        :

        "Code postal " + cp;


    document
      .getElementById(
        "selectedAreaInfo"
      )
      .textContent =
        cp;


    currentPostalCodes =
      [cp];


    schoolSearchInput.value =
      "";


    updateSchoolClearButton();


    activeFilter =
      "ALL";


    updateFilterButtons();


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "";


    activate(
      "schoolScreen"
    );


    applySchoolFilters();

  }


  catch(error){

    console.error(error);


    searchStatus.innerHTML =
      '<div class="status">' +
      'Impossible d’accéder à l’annuaire.' +
      '</div>';

  }

}


/* ==================================================
   DEDOUBLONNAGE
================================================== */

function deduplicateSchools(records){

  const map =
    new Map();


  records.forEach(
    s => {


      const key =

        s.identifiant_de_l_etablissement

        ||

        s.numero_uai

        ||

        s.uai

        ||

        normalizeText(
          s.nom_etablissement
        )

        +

        "|"

        +

        normalizeText(
          s.adresse_1
        )

        +

        "|"

        +

        String(
          s.code_postal || ""
        );


      if(
        !map.has(key)
      ){

        map.set(
          key,
          s
        );

      }

    }
  );


  return Array.from(
    map.values()
  );

}


/* ==================================================
   TRI
================================================== */

function sortSchools(){

  schools.sort(
    (a,b) =>

      String(
        a.nom_etablissement || ""
      )

      .localeCompare(

        String(
          b.nom_etablissement || ""
        ),

        "fr",

        {
          sensitivity:"base"
        }

      )

  );

}


/* ==================================================
   CLASSIFICATION
================================================== */

function schoolCategory(s){

  const type =
    normalizeText(
      s.type_etablissement
    );


  if(
    type === "ECOLE"
  ){

    return "ECOLE";

  }


  if(
    type === "COLLEGE"
  ){

    return "COLLEGE";

  }


  if(
    type === "LYCEE"
  ){

    return "LYCEE";

  }


  return "AUTRE";

}


/* ==================================================
   FILTRES
================================================== */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          activeFilter =
            button.dataset.filter;


          updateFilterButtons();


          applySchoolFilters();

        }
      );

    }
  );


function updateFilterButtons(){

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          button.dataset.filter
          ===
          activeFilter

        );

      }
    );

}


/* ==================================================
   FILTRE TEXTE
================================================== */

schoolSearchInput.addEventListener(
  "input",
  () => {

    updateSchoolClearButton();

    applySchoolFilters();

  }
);


function applySchoolFilters(){

  const query =
    normalizeText(
      schoolSearchInput.value
    );


  const filtered =
    schools.filter(
      s => {


        if(
          activeFilter !== "ALL"

          &&

          schoolCategory(s)
          !==
          activeFilter
        ){

          return false;

        }


        if(
          !query
        ){

          return true;

        }


        const searchable =
          normalizeText(

            [

              s.nom_etablissement,

              s.type_etablissement,

              s.code_postal,

              s.nom_commune,

              s.adresse_1,

              s.adresse_2,

              s.identifiant_de_l_etablissement,

              s.numero_uai

            ]

            .filter(Boolean)

            .join(" ")

          );


        return searchable.includes(
          query
        );

      }
    );


  displaySchools(
    filtered
  );

}


/* ==================================================
   AFFICHAGE ETABLISSEMENTS
================================================== */

function displaySchools(list){

  const container =
    document.getElementById(
      "schoolList"
    );


  const counter =
    document.getElementById(
      "schoolCounter"
    );


  container.innerHTML =
    "";


  counter.textContent =

    list.length

    +

    (
      list.length > 1

      ?

      " établissements"

      :

      " établissement"
    );


  if(
    !list.length
  ){

    container.innerHTML =
      '<div class="empty">' +
      'Aucun établissement correspondant.' +
      '</div>';

    return;

  }


  list.forEach(
    s => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          s.nom_etablissement
          ||
          "Établissement"
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(

          [

            s.type_etablissement,

            [

              s.code_postal,

              s.nom_commune

            ]

            .filter(Boolean)

            .join(" ")

          ]

          .filter(Boolean)

          .join(" · ")

        )

        +

        '</div>';


      div.onclick =
        () =>
          displaySchool(s);


      container.appendChild(
        div
      );

    }
  );

}


/* ==================================================
   FICHE
================================================== */

function displaySchool(s){

  document
    .getElementById(
      "schoolName"
    )
    .textContent =
      s.nom_etablissement
      ||
      "";


  document
    .getElementById(
      "schoolType"
    )
    .textContent =
      s.type_etablissement
      ||
      "Non précisé";


  const address = [

    s.adresse_1,

    s.adresse_2,

    s.adresse_3,

    [

      s.code_postal,

      s.nom_commune

    ]

    .filter(Boolean)

    .join(" ")

  ]

  .filter(Boolean);


  document
    .getElementById(
      "schoolAddress"
    )
    .innerHTML =

      address

      .map(
        escapeHTML
      )

      .join("<br>");


  document
    .getElementById(
      "schoolRNE"
    )
    .textContent =

      s.identifiant_de_l_etablissement

      ||

      s.numero_uai

      ||

      s.uai

      ||

      "Non disponible";


  activate(
    "detailScreen"
  );

}

ensureTerritoriesLoaded()
