<!DOCTYPE html>
<html lang="fr">
<head>

<title>RNE EDU</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#1d1d1f;
}

header{
  background:white;
  padding:max(20px,env(safe-area-inset-top)) 20px 16px;
  border-bottom:1px solid #e5e5e5;

}

}

}

  max-width:650px;

  padding:18px 16px 40px;
}

.search-wrap{

}

input{

}

.status,
.empty{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:15px;
}

.list{
  background:white;
  border-radius:13px;
  overflow:hidden;
}

.item{
  padding:15px 16px;
  border-bottom:1px solid #d1d1d6;
  cursor:pointer;
}

.item:last-child{
  border-bottom:none;
}

.item:active{
  background:#e9e9ed;
}

.item-title{
  font-size:17px;
  font-weight:500;
  line-height:1.3;
}

.item-sub{

}

.match-info{

.match-info strong{

}

.section-label{
  font-size:12px;
  font-weight:700;
  color:#777;
  padding:15px 4px 7px;

}

.search-mode{
  background:#eef5ff;
  border:1px solid #cfe1ff;
  border-radius:12px;
  padding:11px 13px;
  margin:12px 0 14px;
  font-size:14px;
  line-height:1.4;
}

.search-mode strong{
  display:block;
  margin-bottom:2px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.topbar{
  display:flex;
  align-items:center;
  margin-bottom:14px;
}

.back{
  border:none;
  background:none;
  color:#007aff;
  font-size:17px;
  padding:6px 10px 6px 0;
}

.screen-title{
  font-size:21px;
  font-weight:700;
  margin:0;
}

.area-info{
  font-size:14px;
  color:#777;
  margin:4px 0 14px;
  line-height:1.5;
}

.filters{
  display:flex;
  gap:6px;
  margin:10px 0 14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.filter{
  border:1px solid #d1d1d6;
  background:white;
  border-radius:18px;
  padding:8px 12px;
  font-size:14px;
  white-space:nowrap;
}

.filter.active{
  background:#1d1d1f;

  border-color:#1d1d1f;
}

.counter{
  font-size:13px;
  color:#777;
  margin:0 4px 10px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
}

.school-name{
  margin:0 0 20px;
  font-size:22px;
  line-height:1.25;
}

.label{
  font-size:12px;
  color:#777;

  margin-top:18px;
  margin-bottom:5px;
}

.value{
  font-size:17px;
  line-height:1.5;
}

.rne{
  font-size:23px;
  font-weight:700;
  color:#007aff;
  letter-spacing:.5px;
}

@media(max-width:480px){
  main{
    padding-left:15px;
    padding-right:15px;
  }
}

</style>
</head>

<body>

<header>
  <h1>RNE EDU</h1>
  <p>Annuaire des établissements scolaires</p>
</header>

<main>

<section id="searchScreen" class="screen active">

  <div class="search-wrap">

    <input
      id="searchInput"
      type="search"
      enterkeyhint="search"
      placeholder="Ville, établissement, département…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >

    <button
      id="clearSearch"
      class="clear-button"
      type="button"
      aria-label="Effacer"
    >
      ×
    </button>

  </div>

  <div class="hint">
    Ville, établissement, département, académie ou région :
    3 caractères · Code postal : 2 chiffres
  </div>

  <div id="searchStatus"></div>
  <div id="resultList"></div>

</section>


<section id="schoolScreen" class="screen">

  <div class="topbar">

    <button
      class="back"
      onclick="showSearch()"
    >

    </button>

  </div>

  <h2
    id="selectedArea"
    class="screen-title"
  ></h2>

  <div
    id="selectedAreaInfo"

  ></div>

  <div id="searchModeInfo"></div>

  <div class="search-wrap">

    <input
      id="schoolSearchInput"
      type="search"
      enterkeyhint="search"
      placeholder="Filtrer par nom, adresse, ville, RNE…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >

    <button
      id="clearSchoolSearch"
      class="clear-button"
      type="button"
      aria-label="Effacer"
    >
      ×
    </button>

  </div>

  <div class="filters">

    <button class="filter active" data-filter="ALL">
      Tous
    </button>

    <button class="filter" data-filter="ECOLE">
      Écoles
    </button>

    <button class="filter" data-filter="COLLEGE">
      Collèges
    </button>

    <button class="filter" data-filter="LYCEE">
      Lycées
    </button>

    <button class="filter" data-filter="AUTRE">
      Autres
    </button>

  </div>

  <div id="schoolCounter" class="counter"></div>

  <div id="schoolStatus" class="status"></div>

  <div id="schoolList" class="list"></div>

</section>


<section id="detailScreen" class="screen">

  <div class="topbar">

    <button
      class="back"
      onclick="showSchools()"
    >
      ‹ Établissements
    </button>

  </div>

  <div class="card">

    <h2
      id="schoolName"
      class="school-name"
    ></h2>

    <div class="label">
      Type d'établissement
    </div>

      id="schoolType"

    </div>

      id="schoolAddress"
      class="value"
    ></div>

      RNE / UAI
    </div>

    <div

  </div>

</section>

</main>


<script>

const API =
"https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records";

const input =
  document.getElementById("searchInput");

const resultList =
  document.getElementById("resultList");

const searchStatus =
  document.getElementById("searchStatus");

const schoolSearchInput =
  document.getElementById("schoolSearchInput");

const clearSearch =
  document.getElementById("clearSearch");

const clearSchoolSearch =
  document.getElementById("clearSchoolSearch");

let timer = null;
let requestNumber = 0;

let schools = [];
let activeFilter = "ALL";

let currentSearchMode = "";
let currentSearchTerm = "";


/* ==================================================
   OUTILS TEXTE
================================================== */

function normalizeText(text){

  return String(text || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[-'’]/g," ")
    .replace(/\s+/g," ");

}


function normalizeAddressLine(text){

  return String(text || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/Œ/g,"OE")
    .replace(/Æ/g,"AE")
    .replace(/[^A-Z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function normalizeCityForAddress(city){

  const normalized =
    normalizeAddressLine(city);


  if(
    normalized.startsWith("PARIS ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "PARIS";
  }


  if(
    normalized.startsWith("LYON ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "LYON";
  }


  if(
    normalized.startsWith("MARSEILLE ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "MARSEILLE";
  }


  return normalized;

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


function escapeODSQL(value){

  return String(value || "")
    .replaceAll("\\","\\\\")
    .replaceAll('"','\\"');

}


function activate(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      s => s.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList
    .add("active");

  window.scrollTo(0,0);

}


/* ==================================================
   CROIX EFFACEMENT
================================================== */

function updateClearButtons(){

  clearSearch.style.display =
    input.value
      ? "flex"
      : "none";


  clearSchoolSearch.style.display =
    schoolSearchInput.value
      ? "flex"
      : "none";

}


clearSearch.addEventListener(
  "click",
  () => {

    input.value = "";

    resultList.innerHTML = "";
    searchStatus.innerHTML = "";

    clearTimeout(timer);

    requestNumber++;

    updateClearButtons();

    input.focus();

  }
);


clearSchoolSearch.addEventListener(
  "click",
  () => {

    schoolSearchInput.value = "";

    updateClearButtons();

    applySchoolFilters();

    schoolSearchInput.focus();

  }
);


schoolSearchInput.addEventListener(
  "input",
  () => {

    updateClearButtons();

    applySchoolFilters();

  }
);


/* ==================================================
   RELANCE PAR ENTREE
================================================== */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key !== "Enter"
    ){
      return;
    }


    event.preventDefault();

    clearTimeout(timer);


    const value =
      input.value.trim();


    if(!value){
      return;
    }


    const numeric =
      /^\d+$/.test(value);


    if(
      numeric
      &&
      value.length < 2
    ){
      return;
    }


    if(
      !numeric
      &&
      value.length < 3
    ){
      return;
    }


    input.blur();

    resultList.innerHTML = "";
    searchStatus.innerHTML = "";


    smartSearch(
      value,
      numeric
    );

  }
);


/* ==================================================
   API PAGINEE
================================================== */

async function fetchAllRecords(where){

  let records = [];
  let offset = 0;

  const limit = 100;


  while(true){

    const p =
      new URLSearchParams();


    p.set(
      "where",
      where
    );


    p.set(
      "limit",
      String(limit)
    );


    p.set(
      "offset",
      String(offset)
    );


    const response =
      await fetch(
        API +
        "?" +
        p.toString()
      );


    if(!response.ok){

      throw new Error("API");

    }


    const data =
      await response.json();


    const page =
      data.results || [];


    records.push(
      ...page
    );


    if(
      page.length < limit
    ){
      break;
    }


    offset += page.length;


    if(
      offset >= 10000
    ){
      break;
    }

  }


  return records;

}


/* ==================================================
   SAISIE PRINCIPALE
================================================== */

input.addEventListener(
  "input",
  () => {

    clearTimeout(timer);

    updateClearButtons();


    const value =
      input.value.trim();


    resultList.innerHTML = "";
    searchStatus.innerHTML = "";


    if(!value){
      return;
    }


    const numeric =
      /^\d+$/.test(value);


    if(
      numeric
      &&
      value.length < 2
    ){
      return;
    }


    if(
      !numeric
      &&
      value.length < 3
    ){
      return;
    }


    timer =
      setTimeout(
        () =>
          smartSearch(
            value,
            numeric
          ),
        300
      );

  }
);


/* ==================================================
   MOTEUR INTELLIGENT
================================================== */

async function smartSearch(
  value,
  numeric
){

  const request =
    ++requestNumber;


  searchStatus.innerHTML =
    '<div class="status">Recherche…</div>';


  try{


    if(numeric){

      const areas =
        await searchAreas(
          value,
          true
        );


      if(
        request !== requestNumber
      ){
        return;
      }


      searchStatus.innerHTML = "";


      displayAreaResults(
        areas,
        value,
        true
      );


      return;

    }


    const areas =
      await searchAreas(
        value,
        false
      );


    if(
      request !== requestNumber
    ){
      return;
    }


    const exactCities =
      areas.filter(
        area =>

          normalizeText(
            area.city
          )

          ===

          normalizeText(
            value
          )
      );


    if(
      exactCities.length
    ){

      const city =
        exactCities[0];


      searchStatus.innerHTML =

        '<div class="status">'

        +

        'Ville reconnue : '

        +

        escapeHTML(
          city.city
        )

        +

        '<br>Chargement de tous les établissements…'

        +

        '</div>';


      await openCity(
        city.city,
        city.cps,
        true
      );


      if(
        request === requestNumber
      ){
        searchStatus.innerHTML = "";
      }


      return;

    }


    const directSchools =
      await searchSchoolsDirect(
        value
      );


    if(
      request !== requestNumber
    ){
      return;
    }


    searchStatus.innerHTML = "";


    displayMixedResults(
      areas,
      directSchools,
      value
    );

  }


  catch(error){

    console.error(error);


    if(
      request === requestNumber
    ){

      searchStatus.innerHTML =

        '<div class="status">'

        +

        'Impossible d’accéder à l’annuaire.'

        +

        '</div>';

    }

  }

}


/* ==================================================
   RECHERCHE DES COMMUNES
================================================== */

async function searchAreas(
  value,
  numeric
){

  let where;


  if(numeric){

    where =

      'startswith(code_postal,"'

      +

      escapeODSQL(
        value
      )

      +

      '")';

  }

  else{

    where =

      'suggest(nom_commune,"'

      +

      escapeODSQL(
        value
      )

      +

      '")';

  }


  const p =
    new URLSearchParams();


  p.set(
    "select",
    "nom_commune,code_postal,count(*) as nb"
  );


  p.set(
    "group_by",
    "nom_commune,code_postal"
  );


  p.set(
    "where",
    where
  );


  p.set(
    "order_by",
    "nom_commune ASC,code_postal ASC"
  );


  p.set(
    "limit",
    "20000"
  );


  const response =
    await fetch(
      API +
      "?" +
      p.toString()
    );


  if(!response.ok){

    throw new Error("API");

  }


  const data =
    await response.json();


  const map =
    new Map();


  (data.results || [])
  .forEach(
    r => {

      const city =
        String(
          r.nom_commune || ""
        ).trim();


      const cp =
        String(
          r.code_postal || ""
        ).trim();


      if(
        !city
        ||
        !cp
      ){
        return;
      }


      if(numeric){

        if(
          !cp.startsWith(
            value
          )
        ){
          return;
        }

      }

      else{

        if(
          !normalizeText(
            city
          )
          .startsWith(
            normalizeText(
              value
            )
          )
        ){
          return;
        }

      }


      const key =
        normalizeText(
          city
        );


      if(
        !map.has(
          key
        )
      ){

        map.set(
          key,
          {
            city:city,
            cps:new Set()
          }
        );

      }


      map
        .get(key)
        .cps
        .add(cp);

    }
  );


  return Array.from(
    map.values()
  )

  .map(
    x => ({

      city:x.city,

      cps:
        Array.from(
          x.cps
        )
        .sort()

    })
  )

  .sort(
    (a,b) =>

      a.city.localeCompare(
        b.city,
        "fr",
        {
          sensitivity:"base"
        }
      )
  );

}


/* ==================================================
   AFFICHAGE VILLES
================================================== */

function displayAreaResults(
  areas,
  value,
  numeric
){

  resultList.innerHTML = "";


  if(
    !areas.length
  ){

    resultList.innerHTML =
      '<div class="empty">Aucun résultat trouvé</div>';

    return;

  }


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "section-label";


  title.textContent =
    numeric
      ?
      "Villes correspondant au code postal"
      :
      "Villes";


  resultList.appendChild(
    title
  );


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "list";


  areas.forEach(
    area => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          area.city
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(
          area.cps.join(
            " · "
          )
        )

        +

        '</div>';


      div.onclick =
        () => {

          openCity(
            area.city,
            area.cps,
            true
          );

        };


      box.appendChild(
        div
      );

    }
  );


  resultList.appendChild(
    box
  );

}


/* ==================================================
   RECHERCHE PAR NOM
================================================== */

async function searchSchoolsDirect(value){

  const where =

    'search(nom_etablissement,"'

    +

    escapeODSQL(
      value
    )

    +

    '")';


  const records =
    await fetchAllRecords(
      where
    );


  const query =
    normalizeText(
      value
    );


  const found =
    records.filter(
      s =>

        normalizeText(
          s.nom_etablissement
        )
        .includes(
          query
        )
    );


  const unique =
    deduplicateSchools(
      found
    );


  unique.sort(
    (a,b) =>

      String(
        a.nom_etablissement || ""
      )
      .localeCompare(
        String(
          b.nom_etablissement || ""
        ),
        "fr",
        {
          sensitivity:"base"
        }
      )
  );


  return unique;

}


/* ==================================================
   RESULTATS MIXTES
================================================== */

function displayMixedResults(
  areas,
  directSchools,
  value
){

  resultList.innerHTML = "";


  if(
    !areas.length
    &&
    !directSchools.length
  ){

    resultList.innerHTML =
      '<div class="empty">Aucun résultat trouvé</div>';

    return;

  }


  if(
    areas.length
  ){

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "section-label";


    title.textContent =
      "Villes";


    resultList.appendChild(
      title
    );


    const box =
      document.createElement(
        "div"
      );


    box.className =
      "list";


    areas.forEach(
      area => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "item";


        div.innerHTML =

          '<div class="item-title">'

          +

          escapeHTML(
            area.city
          )

          +

          '</div>'

          +

          '<div class="item-sub">'

          +

          escapeHTML(
            area.cps.join(
              " · "
            )
          )

          +

          '</div>';


        div.onclick =
          () => {

            openCity(
              area.city,
              area.cps,
              true
            );

          };


        box.appendChild(
          div
        );

      }
    );


    resultList.appendChild(
      box
    );

  }


  if(
    directSchools.length
  ){

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "section-label";


    title.textContent =

      "Établissements contenant « "

      +

      value

      +

      " » — "

      +

      directSchools.length

      +

      " résultats";


    resultList.appendChild(
      title
    );


    const box =
      document.createElement(
        "div"
      );


    box.className =
      "list";


    directSchools.forEach(
      s => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "item";


        div.innerHTML =

          '<div class="item-title">'

          +

          escapeHTML(
            s.nom_etablissement
            ||
            "Établissement"
          )

          +

          '</div>'

          +

          '<div class="item-sub">'

          +

          escapeHTML(

            [

              s.type_etablissement,

              s.code_postal,

              normalizeCityForAddress(
                s.nom_commune
              )

            ]

            .filter(Boolean)

            .join(" · ")

          )

          +

          '</div>';


        div.onclick =
          () =>
            displaySchool(
              s
            );


        box.appendChild(
          div
        );

      }
    );


    resultList.appendChild(
      box
    );

  }

}


/* ==================================================
   OUVERTURE VILLE
================================================== */

async function openCity(
  city,
  cps,
  cityPriority
){

  activate(
    "schoolScreen"
  );


  document
    .getElementById(
      "selectedArea"
    )
    .textContent =
      city;


  document
    .getElementById(
      "selectedAreaInfo"
    )
    .textContent =
      cps.join(
        " · "
      );


  currentSearchMode =
    "CITY";


  currentSearchTerm =
    city;


  document
    .getElementById(
      "searchModeInfo"
    )
    .innerHTML =

      '<div class="search-mode">'

      +

      '<strong>Recherche principale</strong>'

      +

      'Établissement(s) scolaire(s) de '

      +

      escapeHTML(
        city
      )

      +

      '</div>';


  schoolSearchInput.value =
    "";


  updateClearButtons();


  activeFilter =
    "ALL";


  updateFilterButtons();


  const status =
    document.getElementById(
      "schoolStatus"
    );


  status.textContent =
    "Chargement de tous les établissements…";


  try{

    let all = [];


    for(
      const cp of cps
    ){

      const records =
        await fetchAllRecords(

          'code_postal="'

          +

          escapeODSQL(
            cp
          )

          +

          '"'

        );


      all.push(
        ...records
      );

    }


    schools =
      deduplicateSchools(
        all
      );


    sortSchools();


    status.textContent =
      "";


    applySchoolFilters();

  }


  catch(error){

    console.error(
      error
    );


    status.textContent =
      "Impossible de charger les établissements.";

  }

}


/* ==================================================
   DEDOUBLONNAGE
================================================== */

function deduplicateSchools(records){

  const map =
    new Map();


  records.forEach(
    s => {

      const key =

        s.identifiant_de_l_etablissement

        ||

        s.numero_uai

        ||

        s.uai

        ||

        normalizeText(
          s.nom_etablissement
        )

        +

        "|"

        +

        normalizeText(
          s.adresse_1
        )

        +

        "|"

        +

        String(
          s.code_postal || ""
        );


      if(
        !map.has(
          key
        )
      ){

        map.set(
          key,
          s
        );

      }

    }
  );


  return Array.from(
    map.values()
  );

}


/* ==================================================
   TRI
================================================== */

function sortSchools(){

  schools.sort(
    (a,b) =>

      String(
        a.nom_etablissement || ""
      )
      .localeCompare(
        String(
          b.nom_etablissement || ""
        ),
        "fr",
        {
          sensitivity:"base"
        }
      )
  );

}


/* ==================================================
   CATEGORISATION
================================================== */

function schoolCategory(s){

  const type =
    normalizeText(
      s.type_etablissement
    );


  if(
    type.includes(
      "COLLEGE"
    )
  ){
    return "COLLEGE";
  }


  if(
    type.includes(
      "LYCEE"
    )
  ){
    return "LYCEE";
  }


  if(
    type.includes(
      "ECOLE"
    )
    ||
    type.includes(
      "MATERNELLE"
    )
    ||
    type.includes(
      "ELEMENTAIRE"
    )
    ||
    type.includes(
      "PRIMAIRE"
    )
  ){
    return "ECOLE";
  }


  return "AUTRE";

}


/* ==================================================
   FILTRES TYPE
================================================== */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          activeFilter =
            button.dataset.filter;


          updateFilterButtons();


          applySchoolFilters();

        }
      );

    }
  );


function updateFilterButtons(){

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          button.dataset.filter
          ===
          activeFilter

        );

      }
    );

}


/* ==================================================
   CHAMP AYANT CORRESPONDU
================================================== */

function getFilterMatchInfo(
  s,
  query
){

  if(!query){
    return null;
  }


  const rne =
    s.identifiant_de_l_etablissement
    ||
    s.numero_uai
    ||
    s.uai;


  const fields = [

    {
      label:"Nom",
      value:s.nom_etablissement,
      kind:"NAME"
    },

    {
      label:"Type",
      value:s.type_etablissement,
      kind:"TYPE"
    },

    {
      label:"Adresse",
      value:s.adresse_1,
      kind:"ADDRESS"
    },

    {
      label:"Adresse",
      value:s.adresse_2,
      kind:"ADDRESS"
    },

    {
      label:"Adresse",
      value:s.adresse_3,
      kind:"ADDRESS"
    },

    {
      label:"Ville",
      value:s.nom_commune,
      kind:"CITY"
    },

    {
      label:"Code postal",
      value:s.code_postal,
      kind:"POSTAL"
    },

    {
      label:"RNE / UAI",
      value:rne,
      kind:"RNE"
    }

  ];


  for(
    const field of fields
  ){

    if(
      field.value
      &&
      normalizeText(
        field.value
      )
      .includes(
        query
      )
    ){

      return field;

    }

  }


  return null;

}


/* ==================================================
   FILTRE LISTE
================================================== */

function applySchoolFilters(){

  const rawQuery =
    schoolSearchInput.value.trim();


  const query =
    normalizeText(
      rawQuery
    );


  const filtered =
    schools.filter(
      s => {


        if(
          activeFilter !== "ALL"
          &&
          schoolCategory(
            s
          )
          !==
          activeFilter
        ){

          return false;

        }


        if(
          !query
        ){

          return true;

        }


        return Boolean(
          getFilterMatchInfo(
            s,
            query
          )
        );

      }
    );


  displaySchools(
    filtered,
    rawQuery
  );

}


/* ==================================================
   LISTE ETABLISSEMENTS
================================================== */

function displaySchools(
  list,
  rawQuery = ""
){

  const container =
    document.getElementById(
      "schoolList"
    );


  const counter =
    document.getElementById(
      "schoolCounter"
    );


  container.innerHTML =
    "";


  counter.textContent =

    list.length

    +

    (
      list.length > 1
      ?
      " établissements"
      :
      " établissement"
    );


  if(
    !list.length
  ){

    container.innerHTML =
      '<div class="empty">Aucun établissement correspondant.</div>';

    return;

  }


  const query =
    normalizeText(
      rawQuery
    );


  list.forEach(
    s => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      let matchHTML =
        "";


      if(
        query
      ){

        const match =
          getFilterMatchInfo(
            s,
            query
          );


        if(
          match
          &&
          match.kind !== "NAME"
        ){

          let displayedValue =
            String(
              match.value || ""
            );


          let matchLabel =
            "Trouvé";


          if(
            match.kind === "ADDRESS"
          ){

            matchLabel =
              "Trouvé dans l’adresse";

            displayedValue =
              normalizeAddressLine(
                displayedValue
              );

          }


          else if(
            match.kind === "CITY"
          ){

            matchLabel =
              "Trouvé dans la ville";

            displayedValue =
              normalizeCityForAddress(
                displayedValue
              );

          }


          else if(
            match.kind === "POSTAL"
          ){

            matchLabel =
              "Trouvé dans le code postal";

          }


          else if(
            match.kind === "RNE"
          ){

            matchLabel =
              "Trouvé dans le RNE / UAI";

          }


          else if(
            match.kind === "TYPE"
          ){

            matchLabel =
              "Trouvé dans le type";

          }


          matchHTML =

            '<div class="match-info">'

            +

            '<strong>'

            +

            escapeHTML(
              matchLabel
            )

            +

            '</strong>'

            +

            (
              displayedValue
              ?
              '<br>'
              +
              escapeHTML(
                displayedValue
              )
              :
              ''
            )

            +

            '</div>';

        }

      }


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          s.nom_etablissement
          ||
          "Établissement"
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(

          [

            s.type_etablissement,

            [

              s.code_postal,

              normalizeCityForAddress(
                s.nom_commune
              )

            ]

            .filter(Boolean)

            .join(" ")

          ]

          .filter(Boolean)

          .join(" · ")

        )

        +

        '</div>'

        +

        matchHTML;


      div.onclick =
        () =>
          displaySchool(
            s
          );


      container.appendChild(
        div
      );

    }
  );

}


/* ==================================================
   FICHE ETABLISSEMENT
================================================== */

function displaySchool(s){

  document
    .getElementById(
      "schoolName"
    )
    .textContent =
      s.nom_etablissement
      ||
      "";


  document
    .getElementById(
      "schoolType"
    )
    .textContent =
      s.type_etablissement
      ||
      "Non précisé";


  const postalCode =
    normalizeAddressLine(
      s.code_postal
    );


  const postalCityName =
    normalizeCityForAddress(
      s.nom_commune
    );


  const postalCity =
    [

      postalCode,

      postalCityName

    ]

    .filter(Boolean)

    .join(" ");


  let addressLines = [

    s.adresse_1,

    s.adresse_2,

    s.adresse_3

  ]

  .filter(Boolean)

  .map(
    normalizeAddressLine
  )

  .filter(Boolean);


  addressLines =
    addressLines.filter(
      (line,index,array) =>
        array.indexOf(line)
        ===
        index
    );


  if(
    postalCity
  ){

    addressLines =
      addressLines.filter(
        line => {


          if(
            line === postalCity
          ){
            return false;
          }


          if(
            line.startsWith(
              postalCity + " "
            )
            &&
            line.includes(
              "ARRONDISSEMENT"
            )
          ){
            return false;
          }


          return true;

        }
      );


    addressLines.push(
      postalCity
    );

  }


  document
    .getElementById(
      "schoolAddress"
    )
    .innerHTML =

      addressLines

      .map(
        escapeHTML
      )

      .join(
        "<br>"
      );


  document
    .getElementById(
      "schoolRNE"
    )
    .textContent =

      s.identifiant_de_l_etablissement

      ||

      s.numero_uai

      ||

      s.uai

      ||

      "Non disponible";


  activate(
    "detailScreen"
  );

}
