/* ==================================================

================================================== */

.loading-indicator{

  font-size:13px;
  line-height:1.4;

}

.loading-line{

.loading-line::after{

  background:#007aff;

}

  50%{left:42%;}

}

/* ==================================================
   VIEWPORT IPHONE
   Le shell de recherche épouse TOUJOURS le viewport
   réellement visible, clavier compris.
================================================== */

function updateVisualViewport(){
  const vv = window.visualViewport;

  if(vv){
    document.documentElement.style.setProperty(
      "--vv-top",
      vv.offsetTop + "px"
    );

    document.documentElement.style.setProperty(
      "--vv-height",
      vv.height + "px"
    );
  }else{
    document.documentElement.style.setProperty("--vv-top","0px");
    document.documentElement.style.setProperty("--vv-height","100dvh");
  }
}

updateVisualViewport();

window.addEventListener("resize", updateVisualViewport, {passive:true});

if(window.visualViewport){
  window.visualViewport.addEventListener(
    "resize",
    updateVisualViewport,
    {passive:true}
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateVisualViewport,
    {passive:true}
  );
}


/* ==================================================
   OUTILS
================================================== */

function normalizeText(text){

  return String(text || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/Œ/g,"OE")
    .replace(/Æ/g,"AE")
    .replace(/[^A-Z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}


function normalizedSortText(value){
  return normalizeText(value);
}

function compareNormalizedText(a,b){
  return normalizedSortText(a).localeCompare(
    normalizedSortText(b),
    "fr",
    {
      sensitivity:"base",
      numeric:true,
      ignorePunctuation:true
    }
  );
}

function scrollSearchItemBelowSticky(element,sticky){

  if(!element){
    return;
  }

  const scroller =
    searchResultsScroller;

  const elementRect =
    element.getBoundingClientRect();

  const scrollerRect =
    scroller.getBoundingClientRect();

  const stickyRect =
    sticky.getBoundingClientRect();

  /*
    La cible est placée immédiatement sous le panneau fixe.
    On calcule le déplacement dans le conteneur qui défile,
    plutôt que d'utiliser scrollIntoView(), qui pouvait cacher
    le premier résultat sous le panneau sticky.
  */
  const stickyBottom =
    Math.max(
      stickyRect.bottom,
      scrollerRect.top
    );

  const delta =
    elementRect.top
    -
    stickyBottom;

  scroller.scrollTo({
    top:
      Math.max(
        0,
        scroller.scrollTop
        +
        delta
        -
        2
      ),
    behavior:"smooth"
  });
}



/*
  Clé de tri relative au critère saisi.

  Principe : lorsqu'un terme recherché apparaît dans un nom composé,
  on trie d'abord sur ce qui vient APRES ce terme, et non sur le début
  générique du nom d'établissement.

  Exemples pour la recherche SAINT :
    COLLEGE VICTOR SAINT LAURENT  -> LAURENT ...
    ECOLE SAINT ABRAHAM           -> ABRAHAM
    COLLEGE SAINTE CLAIRE         -> CLAIRE

  Les tirets, apostrophes et accents sont déjà neutralisés par normalizeText().
  Le dernier mot de la requête peut être partiel : SAINT EX retrouvera
  SAINT EXUPERY et consommera le mot EXUPERY entier avant de calculer la suite.
*/
function relativeSearchSortKey(name, query){

  const nameTokens = normalizedSortText(name)
    .split(" ")
    .filter(Boolean);

  const queryTokens = normalizedSortText(query)
    .split(" ")
    .filter(Boolean);

  if(!nameTokens.length){
    return "";
  }

  if(!queryTokens.length){
    return nameTokens.join(" ");
  }

  for(let i=0;i<=nameTokens.length-queryTokens.length;i++){

    let matches=true;

    for(let j=0;j<queryTokens.length;j++){
      const nt=nameTokens[i+j];
      const qt=queryTokens[j];

      /*
        Tolérance sur le dernier terme saisi :
        SAINT correspond à SAINT, SAINTE ou SAINTES ;
        VICT correspond à VICTOR, etc.
      */
      const ok =
        j===queryTokens.length-1
        ? nt.startsWith(qt)
        : nt===qt;

      if(!ok){
        matches=false;
        break;
      }
    }

    if(matches){
      const after=nameTokens.slice(i+queryTokens.length);

      if(after.length){
        return after.join(" ");
      }

      /*
        Si le terme recherché termine le nom, on le classe après
        les noms possédant effectivement une suite.
      */
      return "ZZZZZZ " + nameTokens.join(" ");
    }
  }

  /* Repli : ordre alphabétique normal du nom complet. */
  return nameTokens.join(" ");
}

function compareRelativeSearchNames(aName,bName,query){

  const aKey=relativeSearchSortKey(aName,query);
  const bKey=relativeSearchSortKey(bName,query);

  const primary=compareNormalizedText(aKey,bKey);

  if(primary!==0){
    return primary;
  }

  return compareNormalizedText(aName,bName);
}

function normalizeRNE(value){

  return String(value || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Z0-9]/g,"");
}

function firstSearchToken(value){

  const normalized =
    normalizeText(value);

  return normalized
    .split(" ")
    .filter(Boolean)[0]
    || normalized;
}

function getSearchMode(value){

  const raw =
    String(value || "").trim();

  const compact =
    normalizeRNE(raw);

  /*
    1 à 5 chiffres : code postal.
    Plus de 5 chiffres : RNE / UAI.
  */
  if(/^\d+$/.test(raw)){

    if(compact.length <= 5){
      return "POSTAL";
    }

    return "RNE";
  }

  /*
    RNE / UAI alphanumérique plausible :
    chiffres + lettres, au moins 6 caractères,
    sans espace.
  */
  const hasDigit =
    /\d/.test(compact);

  const hasLetter =
    /[A-Z]/.test(compact);

  const looksLikeRNE =
    compact.length >= 6
    &&
    hasDigit
    &&
    hasLetter
    &&
    !/\s/.test(raw);

  if(looksLikeRNE){
    return "RNE";
  }

  return "TEXT";
}

function normalizeAddressLine(text){
  return String(text || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/Œ/g,"OE")
    .replace(/Æ/g,"AE")
    .replace(/[^A-Z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function normalizeCityForAddress(city){
  const normalized = normalizeAddressLine(city);

  if(
    normalized.startsWith("PARIS ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "PARIS";
  }

  if(
    normalized.startsWith("LYON ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "LYON";
  }

  if(
    normalized.startsWith("MARSEILLE ")
    &&
    normalized.includes("ARRONDISSEMENT")
  ){
    return "MARSEILLE";
  }

  return normalized;
}

function escapeHTML(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function escapeODSQL(value){
  return String(value || "")
    .replaceAll("\\","\\\\")
    .replaceAll('"','\\"');
}

function activate(id){
  document
    .querySelectorAll(".screen")
    .forEach(screen => screen.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  if(id === "searchScreen"){

  }

  window.scrollTo(0,0);
}

/* ==================================================
   API PAGINEE
================================================== */

async function fetchAllRecords(where){

  let records = [];
  let offset = 0;
  const limit = 100;

  while(true){

    const params =
      new URLSearchParams();

    params.set("where",where);
    params.set("limit",String(limit));
    params.set("offset",String(offset));

    const response =
      await fetch(
        API + "?" + params.toString()
      );

    if(!response.ok){
      throw new Error("API");
    }

    const data =
      await response.json();

    const page =
      data.results || [];

    records.push(...page);

    if(page.length < limit){
      break;
    }

    offset += page.length;

    if(offset >= 10000){
      break;
    }
  }

  return records;
}


/* ==================================================
   RECHERCHE DYNAMIQUE
================================================== */

async function dynamicSearch(value){

  const request =
    ++requestNumber;

  searchStatus.innerHTML =
    '<div class="loading-indicator" role="status" aria-live="polite">'
    + '<div class="loading-line" aria-hidden="true"></div>'
    + 'Recherche en cours…'
    + '</div>';

  try{

    const mode =
      getSearchMode(value);

    if(mode === "POSTAL"){

      const postalValue =
        normalizeRNE(value);

      /*
        2 à 4 chiffres : recherche code postal prioritaire.
        5 chiffres : recherche simultanée code postal + début de RNE/UAI.
        Ainsi une saisie comme 09113 peut conduire aux RNE commençant par 09113
        même lorsqu'aucun code postal ne correspond.
      */
      if(postalValue.length === 5){

        const [areas, rneSchools] =
          await Promise.all([
            searchAreas(postalValue, true),
            searchSchoolsByRNEPrefix(postalValue)
          ]);

        if(request !== requestNumber){
          return;
        }

        searchStatus.innerHTML = "";

        displayPostalAndRNEResults(
          postalValue,
          areas,
          rneSchools
        );

        return;
      }

      const areas =
        await searchAreas(
          postalValue,
          true
        );

      if(request !== requestNumber){
        return;
      }

      searchStatus.innerHTML = "";

      displayAreaResults(
        areas,
        true,
        postalValue
      );

      return;
    }

    if(mode === "RNE"){

      const found =
        await searchSchoolsByRNE(value);

      if(request !== requestNumber){
        return;
      }

      searchStatus.innerHTML = "";

      displayRNEResults(
        value,
        found
      );

      return;
    }

    const [areas, directSchools] =
      await Promise.all([
        searchAreas(value, false),
        searchSchoolsDirect(value)
      ]);

    if(request !== requestNumber){
      return;
    }

    searchStatus.innerHTML = "";

    displayTextSearchResults(
      value,
      areas,
      directSchools
    );

  }catch(error){

    console.error(error);

    if(request === requestNumber){
      searchStatus.innerHTML =
        '<div class="status">Impossible d’accéder à l’annuaire.</div>';
    }
  }
}

   TEXTE DU COMPTEUR DE RESULTATS
================================================== */

function resultCountText(count,type){

  if(type === "CITY"){

    if(count === 0){
      return "Aucune ville trouvée";
    }

    if(count === 1){
      return "1 ville trouvée";
    }

    return count
      + " villes trouvées — continuez à saisir pour affiner";
  }

  if(count === 0){
    return "Aucun établissement trouvé";
  }

  if(count === 1){
    return "1 établissement trouvé";
  }

  return count
    + " établissements trouvés — continuez à saisir pour affiner";
}


/* ==================================================
   RECHERCHE VILLES
================================================== */

async function searchAreas(value,numeric){

  let where;

  if(numeric){

    where =
      'startswith(code_postal,"'
      +
      escapeODSQL(value)
      +
      '")';

  }else{

    const broadValue =
      firstSearchToken(value);

    where =
      'suggest(nom_commune,"'
      +
      escapeODSQL(broadValue)
      +
      '")';
  }

  const params =
    new URLSearchParams();

  params.set(
    "select",
    "nom_commune,code_postal,count(*) as nb"
  );

  params.set(
    "group_by",
    "nom_commune,code_postal"
  );

  params.set("where",where);

  params.set(
    "order_by",
    "nom_commune ASC,code_postal ASC"
  );

  params.set("limit","20000");

  const response =
    await fetch(
      API + "?" + params.toString()
    );

  if(!response.ok){
    throw new Error("API");
  }

  const data =
    await response.json();

  const map =
    new Map();

  (data.results || [])
  .forEach(record=>{

    const city =
      String(
        record.nom_commune || ""
      ).trim();

    const cp =
      String(
        record.code_postal || ""
      ).trim();

    if(!city || !cp){
      return;
    }

    if(numeric){

      if(!cp.startsWith(value)){
        return;
      }

    }else{

      if(
        !normalizeText(city)
          .startsWith(
            normalizeText(value)
          )
      ){
        return;
      }
    }

    const key =
      normalizeText(city);

    if(!map.has(key)){
      map.set(
        key,
        {
          city:city,
          cps:new Set()
        }
      );
    }

    map.get(key).cps.add(cp);
  });

  return Array.from(
    map.values()
  )

  .map(area=>({
    city:area.city,
    cps:Array.from(area.cps).sort()
  }))

  .sort(
    (a,b)=>
      a.city.localeCompare(
        b.city,
        "fr",
        {sensitivity:"base"}
      )
  );
}

function displayTextSearchResults(value, areas, directSchools){

  resultList.innerHTML = "";

  const cityCount = areas.length;
  const schoolResults = deduplicateSchools(directSchools);
  schoolResults.sort(comparePostalAscending);
  const schoolCount = schoolResults.length;

  if(!cityCount && !schoolCount){
    resultList.innerHTML =
      '<div class="empty">Aucun résultat trouvé</div>';
    return;
  }

  const summary = document.createElement("div");
  summary.className = "result-summary";

  summary.textContent =
    cityCount
    + (cityCount > 1 ? " villes" : " ville")
    + " · "
    + schoolCount
    + (schoolCount > 1 ? " établissements" : " établissement")
    + " trouvés";

  resultList.appendChild(summary);

  if(cityCount && !schoolCount){
    renderCitySearchSection(resultList, areas, value);
    return;
  }

  if(schoolCount && !cityCount){
    renderSchoolSearchSection(resultList, schoolResults, value);
    return;
  }

  const selector = document.createElement("div");
  selector.className = "filters";

  const cityButton = document.createElement("button");
  cityButton.className = "filter active";
  cityButton.type = "button";
  cityButton.textContent = "Villes (" + cityCount + ")";

  const schoolButton = document.createElement("button");
  schoolButton.className = "filter";
  schoolButton.type = "button";
  schoolButton.textContent = "Établissements (" + schoolCount + ")";

  selector.appendChild(cityButton);
  selector.appendChild(schoolButton);
  resultList.appendChild(selector);

  const content = document.createElement("div");
  resultList.appendChild(content);

  function selectMode(mode){

    cityButton.classList.toggle("active", mode === "CITY");
    schoolButton.classList.toggle("active", mode === "SCHOOL");

    content.innerHTML = "";

    if(mode === "CITY"){
      renderCitySearchSection(content, areas, value);
    }else{
      renderSchoolSearchSection(content, schoolResults, value);
    }
  }

  cityButton.addEventListener("click", () => selectMode("CITY"));
  schoolButton.addEventListener("click", () => selectMode("SCHOOL"));

  selectMode("CITY");
}


function renderCitySearchSection(container, areas, value){

  let sortMode = "NAME";
  let ascending = true;
  let quickOpen = false;
  let selectedQuickKey = null;

  const sticky = document.createElement("div");
  sticky.className = "search-tools-sticky";
  container.appendChild(sticky);

  const title = document.createElement("div");
  title.className = "section-label";
  title.textContent = 'Villes commençant par « ' + value + ' »';
  sticky.appendChild(title);

  const controls = document.createElement("div");
  controls.className = "sorts";
  sticky.appendChild(controls);

  const quickWrap = document.createElement("div");
  sticky.appendChild(quickWrap);

  const box = document.createElement("div");
  box.className = "list";
  container.appendChild(box);

  function cityNameCompare(a,b){
    return compareNormalizedText(a.city,b.city);
  }

  function cityPostal(a){
    const cp=(a.cps&&a.cps[0])||"99999";
    return parseInt(cp,10)||99999;
  }

  function postalZone(cp){
    cp=String(cp||"");
    return cp.startsWith("97")||cp.startsWith("98") ? cp.slice(0,3) : cp.slice(0,2);
  }

  function accessKey(area){
    if(sortMode === "POSTAL"){
      return postalZone((area.cps&&area.cps[0])||"");
    }

    const q = normalizedSortText(value);
    const n = normalizedSortText(area.city);

    let rest = n;

    if(n.startsWith(q)){
      rest = n.slice(q.length).trim();
    }

    return (rest.match(/[A-Z0-9]/)||["#"])[0];
  }

  function renderControls(){
    controls.innerHTML="";
    if(areas.length<=30) return;

    const nameBtn=document.createElement("button");
    nameBtn.className="sort-button"+(sortMode==="NAME"?" active":"");
    nameBtn.textContent="Nom "+(sortMode==="NAME"&&!ascending?"Z→A":"A→Z");
    nameBtn.onclick=()=>{
      selectedQuickKey=null;
      if(sortMode==="NAME") ascending=!ascending;
      else {sortMode="NAME";ascending=true;}
      render();
    };

    const cpBtn=document.createElement("button");
    cpBtn.className="sort-button"+(sortMode==="POSTAL"?" active":"");
    cpBtn.textContent="CP "+(sortMode==="POSTAL"&&!ascending?"↓":"↑");
    cpBtn.onclick=()=>{
      selectedQuickKey=null;
      if(sortMode==="POSTAL") ascending=!ascending;
      else {sortMode="POSTAL";ascending=true;}
      render();
    };

    controls.append(nameBtn,cpBtn);

    if(areas.length>80){
      const quickBtn=document.createElement("button");
      quickBtn.className="sort-button"+(quickOpen?" active":"");
      quickBtn.textContent="Accès rapide";
      quickBtn.onclick=()=>{
        quickOpen=!quickOpen;
        renderQuick(getSorted());
      };
      controls.appendChild(quickBtn);
    }
  }

  function renderQuick(sorted){
    quickWrap.innerHTML="";
    if(!quickOpen||areas.length<=80) return;

    sorted=sorted||getSorted();

    const first=new Map();

    sorted.forEach((area,i)=>{
      const k=accessKey(area);
      if(k&&!first.has(k)) first.set(k,i);
    });

    const label=document.createElement("div");
    label.className="quick-label";
    label.textContent=
      sortMode==="POSTAL"
      ? "Accès par zone de code postal"
      : "Accès dans la liste";

    const row=document.createElement("div");
    row.className="quick-access";

    // Les raccourcis restent toujours présentés dans un ordre logique,
    // indépendamment de l'ordre courant de la liste.
    const keys=[...first.keys()].sort((a,b)=>{
      if(sortMode==="POSTAL"){
        return Number(a)-Number(b);
      }
      return compareNormalizedText(a,b);
    });

    keys.forEach(k=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="quick-chip"+(selectedQuickKey===k?" active":"");
      b.textContent=k;
      b.onclick=()=>{

        selectedQuickKey=k;

        quickWrap
          .querySelectorAll(".quick-chip")
          .forEach(chip=>{
            chip.classList.toggle(
              "active",
              chip.textContent===k
            );
          });

        const el=
          box.querySelector(
            '[data-index="'+first.get(k)+'"]'
          );

        /*
          Le premier élément correspondant devient réellement
          le premier résultat visible sous la barre de commandes.
        */
        scrollSearchItemBelowSticky(
          el,
          sticky
        );
      };
      row.appendChild(b);
    });

    quickWrap.append(label,row);
  }

  function getSorted(){
    const arr=areas.slice();

    arr.sort((a,b)=>
      sortMode==="POSTAL"
      ? (cityPostal(a)-cityPostal(b)||cityNameCompare(a,b))
      : cityNameCompare(a,b)
    );

    if(!ascending) arr.reverse();

    return arr;
  }

  function render(){
    renderControls();
    const sorted=getSorted();
    renderQuick(sorted);
    box.innerHTML="";

    sorted.forEach((area,i)=>{
      const div=document.createElement("div");
      div.className="item";
      div.dataset.index=String(i);
      div.innerHTML=
        '<div class="item-title">'+escapeHTML(area.city)+'</div>'+
        '<div class="item-sub">'+escapeHTML(area.cps.join(" · "))+'</div>';

      div.onclick=()=>{
        input.blur();

        /*
          Une ville sélectionnée depuis une recherche texte
          doit rester strictement limitée à cette commune.
          Le troisième argument "true" est réservé au choix
          explicite "Toutes les villes".
        */
        openCity(
          area.city,
          area.cps,
          false
        );
      };

      box.appendChild(div);
    });
  }

  render();
}

async function searchSchoolsDirect(value){

  const query =
    normalizeText(value);

  const broadValue =
    firstSearchToken(value);

  const where =
    'search(nom_etablissement,"'
    +
    escapeODSQL(broadValue)
    +
    '")';

  const records =
    await fetchAllRecords(where);

  const found =
    records.filter(
      school =>
        normalizeText(
          school.nom_etablissement
        )
        .includes(query)
    );

  return deduplicateSchools(found);
}


/* ==================================================
   RECHERCHE RNE / UAI
================================================== */

async function searchSchoolsByRNEPrefix(value){

  const query =
    normalizeRNE(value);

  if(!query){
    return [];
  }

  const where =
    'search(identifiant_de_l_etablissement,"'
    +
    escapeODSQL(query)
    +
    '")';

  const records =
    await fetchAllRecords(where);

  const found =
    records.filter(
      school => {

        const rne =
          normalizeRNE(
            school.identifiant_de_l_etablissement
            ||
            school.numero_uai
            ||
            school.uai
            ||
            ""
          );

        return rne.startsWith(query);
      }
    );

  return deduplicateSchools(found);
}

){

  resultList.innerHTML = "";

  const rneSchools =

  rneSchools.sort(comparePostalAscending);

  const rneCount = rneSchools.length;

  const summary =

  summary.className =
    "result-summary";

  summary.textContent =
    cityCount
    +
    (cityCount === 1 ? " ville" : " villes")
    +
    " · "
    +
    rneCount
    +
    (rneCount === 1 ? " RNE / UAI" : " RNE / UAI");

  resultList.appendChild(summary);

  if(!cityCount && !rneCount){

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "Aucun code postal ni RNE / UAI correspondant.";

    resultList.appendChild(empty);
    return;
  }

  /*
    Si les deux familles existent, l'utilisateur choisit.
    Code postal reste prioritaire pour une saisie de 5 chiffres.
    Si une seule famille existe, elle est affichée directement.
  */

  let activeTab =
    cityCount ? "POSTAL" : "RNE";

  if(cityCount && rneCount){

    const tabs =
      document.createElement("div");

    tabs.className =
      "filters";

    const postalButton =
      document.createElement("button");

      "RNE / UAI (" + rneCount + ")";

    tabs.appendChild(postalButton);
    tabs.appendChild(rneButton);
    resultList.appendChild(tabs);

    const content =
      document.createElement("div");

    resultList.appendChild(content);

    function renderTab(){

      content.innerHTML = "";

      postalButton.classList.toggle(
        "active",
        activeTab === "POSTAL"
      );

      rneButton.classList.toggle(
        "active",
        activeTab === "RNE"
      );

      if(activeTab === "POSTAL"){
        renderPostalAreasInto(content, areas, value);
      }else{
        renderRNEListInto(content, rneSchools, value);
      }
    }

    postalButton.onclick = ()=>{
      activeTab = "POSTAL";
      renderTab();
    };

    rneButton.onclick = ()=>{
      activeTab = "RNE";
      renderTab();
    };

    renderTab();
    return;
  }

  const content =
    document.createElement("div");

  resultList.appendChild(content);

  if(cityCount){
    renderPostalAreasInto(content, areas, value);
  }else{
    renderRNEListInto(content, rneSchools, value);
  }
}

async function openCity(
  city,
  cps,
  allCities = false
){

  currentSearchMode =
    allCities
    ?
    "POSTAL_ALL_CITIES"
    :
    "CITY";

  currentSearchTerm =
    city;

  activeFilter =
    "ALL";

  activeSort =
    "POSTAL";

  postalAscending =
    true;

  nameAscending =
    true;

  schoolSearchInput.value =
    "";


  const postalLabel =
    cps.join(" · ");


  document
    .getElementById("selectedArea")
    .textContent =
      allCities
      ?
      "Toutes les villes"
      :
      city;


  document
    .getElementById("selectedAreaInfo")
    .textContent =
      postalLabel;


  document
    .getElementById("searchModeInfo")
    .innerHTML =
      '<div class="search-mode">'
      +
      '<strong>Recherche principale</strong>'
      +
      (
        allCities
        ?
        'Établissement(s) scolaire(s) de toutes les villes du code postal '
          + escapeHTML(postalLabel)
        :
        'Établissement(s) scolaire(s) de '
          + escapeHTML(city)
      )
      +
      '</div>';


  updateFilterButtons();
  updateSortButtons();
  updateClearButtons();

  activate("schoolScreen");


  const status =
    document.getElementById(
      "schoolStatus"
    );

  status.textContent =
    "Chargement des établissements…";


  configureSchoolListContext([]);


  try{

    let all = [];


    for(const cp of cps){

      const records =
        await fetchAllRecords(
          'code_postal="'
          +
          escapeODSQL(cp)
          +
          '"'
        );

      all.push(...records);
    }


    /*
      Règle importante :

      - si une commune précise a été sélectionnée :
        on conserve UNIQUEMENT les établissements dont
        nom_commune correspond à cette commune ;

      - si "Toutes les villes" a été sélectionné :
        on conserve tous les établissements des codes postaux concernés.
    */

    const normalizedSelectedCity =
      normalizeText(city);


    const selectedRecords =
      all.filter(school => {

        const schoolCp =
          String(
            school.code_postal || ""
          );

        if(!cps.includes(schoolCp)){
          return false;
        }


        if(allCities){
          return true;
        }


        /*
          Cohérence stricte ville sélectionnée -> établissement affiché.
          Les accents/tirets ne comptent pas grâce à normalizeText(),
          mais aucune autre commune partageant le même CP n'est admise.
        */
        return (
          normalizeText(
            school.nom_commune
          )
          ===
          normalizedSelectedCity
        );
      });


    schools =
      deduplicateSchools(
        selectedRecords
      );


    status.textContent = "";


    configureSchoolListContext(
      schools
    );


    applySchoolFilters();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "Impossible de charger les établissements.";
  }
}


/* ==================================================
   DEDOUBLONNAGE
================================================== */

function deduplicateSchools(records){

  const map =
    new Map();

  records.forEach(school=>{

    const key =
      school.identifiant_de_l_etablissement
      ||
      school.numero_uai
      ||
      school.uai
      ||
      (
        normalizeText(
          school.nom_etablissement
        )
        +
        "|"
        +
        normalizeText(
          school.adresse_1
        )
        +
        "|"
        +
        String(
          school.code_postal || ""
        )
      );

    if(!map.has(key)){
      map.set(key,school);
    }
  });

  return Array.from(
    map.values()
  );
}


/* ==================================================
   CATEGORIES
================================================== */

function schoolCategory(school){

  const type =
    normalizeText(
      school.type_etablissement
    );

  if(
    type.includes("COLLEGE")
  ){
    return "COLLEGE";
  }

  if(
    type.includes("LYCEE")
  ){
    return "LYCEE";
  }

  if(
    type.includes("ECOLE")
    ||
    type.includes("MATERNELLE")
    ||
    type.includes("ELEMENTAIRE")
    ||
    type.includes("PRIMAIRE")
  ){
    return "ECOLE";
  }

  return "AUTRE";
}

function configureSchoolListContext(records){

  const list =

  const postalCodes =
    Array.from(
      new Set(
        list
        .map(s => String(s.code_postal || "").trim())
        .filter(Boolean)
      )
    );

  const cities =
    Array.from(
      new Set(
        list
        .map(s => normalizeText(s.nom_commune))
        .filter(Boolean)
      )
    );

  const categoryCounts = {
    ECOLE:0,
    COLLEGE:0,
    LYCEE:0,
    AUTRE:0
  };

  list.forEach(school=>{
    const category =
      schoolCategory(school);

    if(
      Object.prototype.hasOwnProperty.call(
        categoryCounts,
        category
      )
    ){
      categoryCounts[category]++;
    }
  });

  const nonEmptyCategories =
    Object.entries(categoryCounts)
    .filter(([,count]) => count > 0);


  /*
    FILTRE TEXTE SECONDAIRE

    Il n'est affiché que si la liste est suffisamment longue
    pour qu'un affinage local apporte un gain réel.
  */

  let showSecondarySearch =
    total > 20;


  /*
    Pour une recherche par nom d'établissement, le filtre local
    reste utile dès 10 résultats afin de pouvoir préciser ville,
    CP, adresse ou RNE.
  */

  if(
    currentSearchMode === "NAME"
    &&
    total > 10
  ){
    showSecondarySearch = true;
  }


  schoolSecondarySearch.classList.toggle(
    "context-hidden",
    !showSecondarySearch
  );


  if(!showSecondarySearch){

    schoolSearchInput.value = "";

    clearSchoolSearch.style.display =
      "none";

  }else{

    if(currentSearchMode === "CITY"){

      if(postalCodes.length > 1){

        schoolSearchInput.placeholder =
          "Affiner : nom, CP, adresse ou RNE…";

      }else{

        schoolSearchInput.placeholder =
          "Affiner : nom, adresse ou RNE…";
      }

    }else if(
      currentSearchMode === "POSTAL_ALL_CITIES"
    ){

      schoolSearchInput.placeholder =
        "Affiner : ville, nom, adresse ou RNE…";

    }else if(
      currentSearchMode === "NAME"
    ){

      schoolSearchInput.placeholder =
        "Affiner : ville, CP, adresse ou RNE…";

    }else{

      schoolSearchInput.placeholder =
        "Affiner les résultats…";
    }
  }


  /*
    FILTRES DE TYPE

    S'ils ne peuvent rien distinguer (une seule catégorie),
    on les retire complètement.
  */

  const showTypeFilters =
    nonEmptyCategories.length > 1;

  schoolTypeFilters.classList.toggle(
    "context-hidden",
    !showTypeFilters
  );


  const filterLabels = {
    ALL:"Tous",
    ECOLE:"Écoles",
    COLLEGE:"Collèges",
    LYCEE:"Lycées",
    AUTRE:"Autres"
  };


  schoolTypeFilters
    .querySelectorAll(".filter")
    .forEach(button=>{

      const key =
        button.dataset.filter;

      if(key === "ALL"){

        button.classList.toggle(
          "context-hidden",
          !showTypeFilters
        );

        button.textContent =
          "Tous (" + total + ")";

        return;
      }

      const count =
        categoryCounts[key] || 0;

      button.classList.toggle(
        "context-hidden",
        count === 0
      );

      button.textContent =
        (filterLabels[key] || key)
        +
        " ("
        +
        count
        +
        ")";
    });


  /*
    TRI

    - CP : uniquement s'il existe réellement plusieurs CP.
    - Nom : uniquement pour une liste qui mérite d'être triée.
    - aucun tri pour une toute petite liste.
  */

  const showNameSort =
    total > 5;

  const showPostalSort =
    total > 5
    &&
    postalCodes.length > 1;

  sortName.classList.toggle(
    "context-hidden",
    !showNameSort
  );

  sortPostal.classList.toggle(
    "context-hidden",
    !showPostalSort
  );

  schoolSorts.classList.toggle(
    "context-hidden",
    !showNameSort
    &&
    !showPostalSort
  );


  /*
    Si le tri CP n'est plus pertinent, on repasse automatiquement
    au tri alphabétique afin d'éviter un état invisible/incohérent.
  */

  if(
    activeSort === "POSTAL"
    &&
    !showPostalSort
  ){

    activeSort =
      "NAME";

    nameAscending =
      true;
  }


  updateSortButtons();


  /*
    MESSAGE DE CONTEXTE

    On évite les formulations redondantes pour les petites listes.
  */

  const modeInfo =
    document.getElementById(
      "searchModeInfo"
    );


  if(currentSearchMode === "CITY"){

    if(total <= 20){

      modeInfo.innerHTML = "";

    }else{

      modeInfo.innerHTML =
        '<div class="search-mode">'
        +
        '<strong>Recherche limitée à '
        +
        escapeHTML(currentSearchTerm)
        +
        '</strong>'
        +
        total
        +
        ' établissement'
        +
        (total > 1 ? 's' : '')
        +
        ' dans cette commune'
        +
        '</div>';
    }

  }else if(
    currentSearchMode === "POSTAL_ALL_CITIES"
  ){

    modeInfo.innerHTML =
      '<div class="search-mode">'
      +
      '<strong>Toutes les villes du code postal</strong>'
      +
      cities.length
      +
      ' ville'
      +
      (cities.length > 1 ? 's' : '')
      +
      ' · '
      +
      total
      +
      ' établissement'
      +
      (total > 1 ? 's' : '')
      +
      '</div>';

  }else if(
    currentSearchMode === "NAME"
  ){

    modeInfo.innerHTML =
      '<div class="search-mode">'
      +
      '<strong>Recherche par nom</strong>'
      +
      total
      +
      ' établissement'
      +
      (total > 1 ? 's' : '')
      +
      ' contenant « '
      +
      escapeHTML(currentSearchTerm)
      +
      ' »'
      +
      '</div>';
  }
}

function postalValue(school){

  const cp =
    String(
      school.code_postal || ""
    )
    .replace(/\D/g,"");

  return cp
    ?
    Number(cp)
    :
    999999;
}

function compareNameAscending(a,b){
  return compareNormalizedText(
    a.nom_etablissement || "",
    b.nom_etablissement || ""
  );
}

function compareNameDescending(a,b){
  return -
    compareNameAscending(a,b);
}

function comparePostalAscending(a,b){

  const cpA =
    postalValue(a);

  const cpB =
    postalValue(b);

  if(cpA !== cpB){
    return cpA - cpB;
  }

  return compareNameAscending(a,b);
}

function comparePostalDescending(a,b){

  const cpA =
    postalValue(a);

  const cpB =
    postalValue(b);

  if(cpA !== cpB){
    return cpB - cpA;
  }

  return compareNameAscending(a,b);
}

/* ==================================================
   CORRESPONDANCE DU FILTRE SECONDAIRE
================================================== */

function getFilterMatchInfo(
  school,
  query
){

  if(!query){
    return null;
  }

  const rne =
    school.identifiant_de_l_etablissement
    ||
    school.numero_uai
    ||
    school.uai;

  const fields = [
    {
      kind:"NAME",
      value:school.nom_etablissement
    },
    {
      kind:"CITY",
      value:school.nom_commune
    },
    {
      kind:"POSTAL",
      value:school.code_postal
    },
    {
      kind:"ADDRESS",
      value:school.adresse_1
    },
    {
      kind:"ADDRESS",
      value:school.adresse_2
    },
    {
      kind:"ADDRESS",
      value:school.adresse_3
    },
    {
      kind:"TYPE",
      value:school.type_etablissement
    },
    {
      kind:"RNE",
      value:rne
    }
  ];

  for(
    const field of fields
  ){

    if(
      field.value
      &&
      normalizeText(
        field.value
      ).includes(query)
    ){
      return field;
    }
  }

  return null;
}


/* ==================================================
   APPLICATION FILTRES + TRI
================================================== */

function applySchoolFilters(){

  const rawQuery =
    schoolSearchInput.value.trim();

  const query =
    normalizeText(rawQuery);

  let filtered =
    schools.filter(school=>{

      if(
        activeFilter !== "ALL"
        &&
        schoolCategory(school)
        !==
        activeFilter
      ){
        return false;
      }

      if(!query){
        return true;
      }

      return Boolean(
        getFilterMatchInfo(
          school,
          query
        )
      );
    });

  filtered =
    filtered.slice();

  if(
    activeSort === "POSTAL"
  ){

    filtered.sort(
      postalAscending
      ?
      comparePostalAscending
      :
      comparePostalDescending
    );

  }else{

    filtered.sort(
      nameAscending
      ?
      compareNameAscending
      :
      compareNameDescending
    );
  }

  displaySchools(
    filtered,
    rawQuery
  );
}

function displaySchools(
  list,
  rawQuery = ""
){

  const container =
    document.getElementById(
      "schoolList"
    );

  const counter =
    document.getElementById(
      "schoolCounter"
    );

  container.innerHTML = "";

  counter.textContent =
    list.length
    +
    (
      list.length > 1
      ?
      " établissements"
      :
      " établissement"
    );

  if(!list.length){

    container.innerHTML =
      '<div class="empty">Aucun établissement correspondant.</div>';

    return;
  }

  const query =
    normalizeText(rawQuery);

  list.forEach(school=>{

    const div =
      document.createElement("div");

    div.className =
      "item";

    let matchHTML = "";

    if(query){

      const match =
        getFilterMatchInfo(
          school,
          query
        );

      if(
        match
        &&
        match.kind !== "NAME"
      ){

        let label = "Trouvé";

        let value =
          String(
            match.value || ""
          );

        if(
          match.kind === "ADDRESS"
        ){

          label =
            "Trouvé dans l’adresse";

          value =
            normalizeAddressLine(value);

        }else if(
          match.kind === "CITY"
        ){

          label =
            "Trouvé dans la ville";

          value =
            normalizeCityForAddress(value);

        }else if(
          match.kind === "POSTAL"
        ){

          label =
            "Trouvé dans le code postal";

        }else if(
          match.kind === "TYPE"
        ){

          label =
            "Trouvé dans le type";

        }else if(
          match.kind === "RNE"
        ){

          label =
            "Trouvé dans le RNE / UAI";
        }

        matchHTML =
          '<div class="match-info">'
          +
          '<strong>'
          +
          escapeHTML(label)
          +
          '</strong>'
          +
          (
            value
            ?
            '<br>'
            +
            escapeHTML(value)
            :
            ""
          )
          +
          '</div>';
      }
    }

    const city =
      normalizeCityForAddress(
        school.nom_commune
      );

    const location =
      [
        school.code_postal,
        city
      ]
      .filter(Boolean)
      .join(" ");

    div.innerHTML =
      '<div class="item-title">'
      +
      escapeHTML(
        school.nom_etablissement
        ||
        "Établissement"
      )
      +
      '</div>'
      +
      '<div class="item-sub">'
      +
      escapeHTML(
        [
          school.type_etablissement,
          location
        ]
        .filter(Boolean)
        .join(" · ")
      )
      +
      '</div>'
      +
      matchHTML;

    div.onclick =
      ()=>displaySchool(school);

    container.appendChild(div);
  });
}

function formatFrenchPhone(value){
  const digits=String(value||"").replace(/\D/g,"");
  if(digits.length===10){
    return digits.replace(/(\d{2})(?=\d)/g,"$1 ").trim();
  }
  return String(value||"").trim();
}

function formatSiret(value){
  const digits=String(value||"").replace(/\D/g,"");
  if(digits.length===14){
    return digits.slice(0,3)+" "
      +digits.slice(3,6)+" "
      +digits.slice(6,9)+" "
      +digits.slice(9,14);
  }
  return String(value||"").trim();
}

function formatStudentCount(value){
  if(value===null||value===undefined||value===""){
    return "Non disponible";
  }
  const n=Number(value);
  return Number.isFinite(n)
    ? n.toLocaleString("fr-FR")+" élèves"
    : String(value);
}

async function fetchEffectifFromSource(source,rne){

  const normalizedRne =
    normalizeRNE(rne);

  if(!normalizedRne){
    return null;
  }


  /*
    Plusieurs versions du portail Opendatasoft ont eu des
    comportements légèrement différents avec les clauses WHERE.
    On essaie donc deux requêtes successives :

    1. égalité stricte sur le champ UAI ;
    2. search() sur ce même champ si la première ne renvoie rien
       ou si elle est refusée par l'API.

    Le tri par rentrée est réalisé ensuite localement.
  */

  /*
    Certains jeux ont changé de nom de champ UAI au fil des versions.
    On essaie donc le champ configuré puis les variantes usuelles.
  */
  const idFields =
    [
      source.idField,
      "uai",
      "numero_uai",
      "numero_college",
      "numero_lycee",
      "numero_ecole"
    ]
    .filter((field,index,array)=>
      field
      &&
      array.indexOf(field)===index
    );


  const whereCandidates = [];


  idFields.forEach(idField => {

    whereCandidates.push({
      idField:idField,
      where:
        idField
        +
        '="'
        +
        escapeODSQL(normalizedRne)
        +
        '"'
    });

    whereCandidates.push({
      idField:idField,
      where:
        'search('
        +
        idField
        +
        ',"'
        +
        escapeODSQL(normalizedRne)
        +
        '")'
    });

  });


  let records = [];


  for(const candidate of whereCandidates){

    const where =
      candidate.where;

    const idField =
      candidate.idField;

    try{

      const params =
        new URLSearchParams();

      params.set(
        "where",
        where
      );

      /*
        Un établissement ne possède que quelques lignes historiques.
        100 laisse une marge très confortable sans requête paginée.
      */
      params.set(
        "limit",
        "100"
      );


      const url =
        EFFECTIF_API_BASE
        +
        "/"
        +
        source.dataset
        +
        "/records?"
        +
        params.toString();


      const response =
        await fetch(url);


      if(!response.ok){
        continue;
      }


      const data =
        await response.json();


      records =
        (data.results || [])
        .filter(record => {

          return normalizeRNE(
            record[idField]
          )
          ===
          normalizedRne;

        });


      if(records.length){
        break;
      }

    }

    catch(error){

      console.warn(
        "Recherche effectif non disponible pour",
        source.dataset,
        where,
        error
      );

    }

  }


  if(!records.length){
    return null;
  }


  const candidates = [];


  records.forEach(record => {

    /*
      rentree_scolaire peut être renvoyée comme nombre ou chaîne.
    */
    const yearText =
      String(
        record.rentree_scolaire
        ??
        record.rentree
        ??
        ""
      );

    const yearMatch =
      yearText.match(/\d{4}/);

    const year =
      yearMatch
      ?
      Number(yearMatch[0])
      :
      NaN;


    let count = null;


    for(const field of source.valueFields){

      const raw =
        record[field];


      if(
        raw !== undefined
        &&
        raw !== null
        &&
        raw !== ""
      ){

        const cleaned =
          String(raw)
          .replace(/\s/g,"")
          .replace(",", ".");

        const n =
          Number(cleaned);


        if(Number.isFinite(n)){

          count = n;
          break;

        }

      }

    }


    /*
      Sécurité supplémentaire :
      certains jeux historiques n'emploient pas exactement
      le même identifiant de champ pour l'effectif total.
      Si aucun des champs prévus n'existe, on recherche
      automatiquement un champ numérique dont le nom contient
      ELEVE et TOTAL, sans prendre les sous-totaux par sexe/niveau.
    */

    if(count === null){

      const possibleFields =
        Object.keys(record)
        .filter(key => {

          const k =
            normalizeText(key)
            .replace(/ /g,"_");

          return (
            k.includes("ELEVE")
            &&
            k.includes("TOTAL")
            &&
            !k.includes("FILLE")
            &&
            !k.includes("GARCON")
            &&
            !k.includes("LV")
            &&
            !k.includes("NIVEAU")
          );

        });


      for(const field of possibleFields){

        const raw =
          record[field];

        const cleaned =
          String(raw ?? "")
          .replace(/\s/g,"")
          .replace(",", ".");

        const n =
          Number(cleaned);

        if(Number.isFinite(n)){

          count = n;
          break;

        }

      }

    }


    if(
      Number.isFinite(year)
      &&
      count !== null
    ){

      candidates.push({
        year:year,
        count:count,
        dataset:source.dataset
      });

    }

  });


  if(!candidates.length){
    return null;
  }


  candidates.sort(
    (a,b) =>
      b.year - a.year
  );


  return candidates[0];
}


async function fetchLatestEnrollment(school){

  const rne=normalizeRNE(
    school.identifiant_de_l_etablissement
    ||school.numero_uai
    ||school.uai
    ||""
  );

  if(!rne){
    return null;
  }

  const category=schoolCategory(school);

  let sources=[];

  if(EFFECTIF_SOURCES[category]){
    sources=EFFECTIF_SOURCES[category];
  }else{
    /*
      Cas atypique (EREA, établissement régional, etc.) :
      on essaie les quatre bases afin de retrouver un éventuel effectif.
    */
    sources=[
      ...EFFECTIF_SOURCES.ECOLE,
      ...EFFECTIF_SOURCES.COLLEGE,
      ...EFFECTIF_SOURCES.LYCEE
    ];
  }

  const settled=await Promise.allSettled(
    sources.map(source=>fetchEffectifFromSource(source,rne))
  );

  const found=settled
    .filter(result=>result.status==="fulfilled" && result.value)
    .map(result=>result.value);

  if(!found.length){

    const annuaireCount =
      Number(
        school.nombre_d_eleves
        ??
        school.nombre_eleves
        ??
        school.effectif
        ??
        ""
      );

    if(Number.isFinite(annuaireCount) && annuaireCount > 0){

      return {
        year:null,
        count:annuaireCount,
        sources:["fr-en-annuaire-education"]
      };

    }

    return null;
  }

  const latestYear=Math.max(...found.map(item=>item.year));

  const latest=found.filter(item=>item.year===latestYear);

  let total;


  if(category==="LYCEE"){

    /*
      Pour un lycée polyvalent réellement présent dans deux jeux
      complémentaires GT et PRO, les effectifs peuvent être additionnés.
    */
    const uniqueByDataset =
      new Map();

    latest.forEach(item=>{
      uniqueByDataset.set(
        item.dataset,
        item
      );
    });

    total =
      Array.from(uniqueByDataset.values())
      .reduce(
        (sum,item)=>sum+item.count,
        0
      );

  }else{

    /*
      Pour écoles et collèges, plusieurs jeux peuvent contenir
      le même effectif. On ne les additionne surtout pas.
      On conserve la valeur la plus élevée pour la dernière rentrée,
      ce qui évite le double comptage.
    */
    total =
      Math.max(
        ...latest.map(item=>item.count)
      );

  }


  return {
    year:latestYear,
    count:total,
    sources:latest.map(item=>item.dataset)
  };
}

  return String(year)+"-"+String(Number(year)+1);
}


async function displaySchool(school){

  document
    .getElementById("schoolName")
    .textContent =
      school.nom_etablissement
      ||
      "";

  document
    .getElementById("schoolType")
    .textContent =
      school.type_etablissement
      ||
      "Non précisé";

  const postalCode =
    normalizeAddressLine(
      school.code_postal
    );

  const postalCityName =
    normalizeCityForAddress(
      school.nom_commune
    );

  const postalCity =
    [
      postalCode,
      postalCityName
    ]
    .filter(Boolean)
    .join(" ");

  let addressLines =
    [
      school.adresse_1,
      school.adresse_2,
      school.adresse_3
    ]
    .filter(Boolean)
    .map(normalizeAddressLine)
    .filter(Boolean);

  addressLines =
    addressLines.filter(
      (line,index,array)=>
        array.indexOf(line) === index
    );

  if(postalCode){
    addressLines =
      addressLines.filter(
        line => {
          if(
            line === postalCode
            ||
            line.startsWith(postalCode + " ")
          ){
            return false;
          }
          return true;
        }
      );
  }

  if(postalCity){
    addressLines.push(postalCity);
  }

  document
    .getElementById("schoolAddress")
    .innerHTML =
      addressLines
      .map(escapeHTML)
      .join("<br>");

  document
    .getElementById("schoolRNE")
    .textContent =
      school.identifiant_de_l_etablissement
      ||
      school.numero_uai
      ||
      school.uai
      ||
      "Non disponible";

  const phone=school.telephone||"";
  const phoneElement=document.getElementById("schoolPhone");

  if(phone){
    const phoneDigits=String(phone).replace(/\D/g,"");
    phoneElement.innerHTML=
      '<a href="tel:'+escapeHTML(phoneDigits)+'">'
      +escapeHTML(formatFrenchPhone(phone))
      +'</a>';
  }else{
    phoneElement.textContent="Non disponible";
  }

  const mail=school.mail||"";

function showSearch(){

  activate("searchScreen");

  searchResultsScroller.scrollTop = 0;

  updateClearButtons();


  /*
    Au retour depuis une liste ou une fiche établissement,
    la saisie présente dans le champ doit produire immédiatement
    la même liste de résultats qu'avant la navigation.

    Il n'est donc plus nécessaire d'ajouter/supprimer un caractère
    ni d'appuyer sur Entrée pour "réveiller" la recherche.
  */

  const currentValue =
    input.value.trim();


  searchStatus.innerHTML = "";
  resultList.innerHTML = "";


  if(currentValue){

    const mode =
      getSearchMode(currentValue);

    const validPostal =
      mode !== "POSTAL"
      ||
      normalizeRNE(currentValue).length >= 2;

    const validText =
      mode !== "TEXT"
      ||
      normalizeText(currentValue).length >= 3;


    if(validPostal && validText){

      clearTimeout(timer);

      /*
        Invalide toute ancienne réponse API susceptible d'arriver
        après le retour écran.
      */
      requestNumber++;

      timer =
        setTimeout(
          ()=>dynamicSearch(currentValue),
          80
        );
    }
  }


  /*
    On remet ensuite le focus :
    l'utilisateur peut continuer à saisir immédiatement.
  */
  setTimeout(
    ()=>{
      updateVisualViewport();
      input.focus();
    },
    100
  );
}

let tesseractLoaderPromise = null;

function loadTesseract(){

  if(
    window.Tesseract
    &&
    typeof window.Tesseract.recognize === "function"
  ){
    return Promise.resolve(window.Tesseract);
  }

  if(tesseractLoaderPromise){
    return tesseractLoaderPromise;
  }

  tesseractLoaderPromise =
    new Promise((resolve,reject)=>{

      const script =
        document.createElement("script");

      script.src =
        "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

      script.async = true;

      script.onload = ()=>{

        if(
          window.Tesseract
          &&
          typeof window.Tesseract.recognize === "function"
        ){
          resolve(window.Tesseract);
        }else{
          reject(
            new Error("Tesseract non initialisé")
          );
        }
      };

      script.onerror = ()=>{
        reject(
          new Error("Chargement Tesseract impossible")
        );
      };

      document.head.appendChild(script);
    });

  return tesseractLoaderPromise;
}

async function loadImageForOCR(file){

  if("createImageBitmap" in window){
    try{
      return await createImageBitmap(file);
    }catch(error){
      console.warn("createImageBitmap indisponible",error);
    }
  }

  return await new Promise((resolve,reject)=>{

      resolve(img);
    };

    img.onerror = error=>{

      reject(error);
    };

    img.src = url;
  });
}


function buildRotatedCanvas(
  image,
  angle,
  maxSide = 1800
){

  const sourceWidth =
    image.width;

  const sourceHeight =
    image.height;

  const scale =
    Math.min(
      1,
      maxSide
      /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );

  const w =
    Math.max(
      1,
      Math.round(
        sourceWidth * scale
      )
    );

  const h =
    Math.max(
      1,
      Math.round(
        sourceHeight * scale
      )
    );

  const quarterTurn =
    Math.abs(angle) % 180 === 90;

  const canvas =
    document.createElement("canvas");

  canvas.width =
    quarterTurn
    ?
    h
    :
    w;

  canvas.height =
    quarterTurn
    ?
    w
    :
    h;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.translate(
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.rotate(
    angle
    *
    Math.PI
    /
    180
  );

  ctx.drawImage(
    image,
    -w / 2,
    -h / 2,
    w,
    h
  );

  ctx.restore();

  return canvas;
}


function ocrTextQuality(
  text,
  confidence = 0
){

  const raw =
    String(text || "");

  const normalized =
    normalizeText(raw);

  if(!normalized){
    return -1000;
  }

  const words =
    normalized
    .split(" ")
    .filter(Boolean);

  const readableWords =
    words.filter(word=>
      /^[A-Z]{3,}$/.test(word)
    );

  let score =
    Number(confidence || 0);

  score +=
    Math.min(
      40,
      readableWords.length * 2
    );

  if(/\b\d{5}\b/.test(raw)){
    score += 35;
  }

  [
    "RUE",
    "AVENUE",
    "BOULEVARD",
    "CHEMIN",
    "ROUTE",
    "IMPASSE",
    "PLACE",
    "COLLEGE",
    "LYCEE",
    "ECOLE",
    "PARIS",
    "SAINT",
    "SAINTE"
  ]
  .forEach(term=>{
    if(normalized.includes(term)){
      score += 8;
    }
  });

  return score;
}


async function recognizeBestOrientation(
  file,
  TesseractLib
){

  const image =
    await loadImageForOCR(file);

  const angles =
    [0,90,180,270];

  const readings = [];

  try{

    for(
      let i=0;
      i<angles.length;
      i++
    ){

      const angle =
        angles[i];

      setOCRStatus(
        "Recherche de l’orientation… "
        +
        (i+1)
        +
        "/4",
        i / 5
      );

      const canvas =
        buildRotatedCanvas(
          image,
          angle,
          1250
        );

      const result =
        await TesseractLib.recognize(
          canvas,
          "fra",
          {
            logger:message=>{

              if(
                message.status === "recognizing text"
                &&
                typeof message.progress === "number"
              ){

                const global =
                  (
                    i
                    +
                    message.progress
                  )
                  /
                  5;

                setOCRStatus(
                  "Lecture du texte…",
                  global
                );
              }
            }
          }
        );

      const candidateText =
        result
        &&
        result.data
        ?
        String(
          result.data.text
          ||
          ""
        )
        :
        "";

      const confidence =
        result
        &&
        result.data
        ?
        Number(
          result.data.confidence
          ||
          0
        )
        :
        0;

      readings.push({
        angle,
        text:candidateText,
        confidence,
        score:
          ocrTextQuality(
            candidateText,
            confidence
          )
      });
    }


    readings.sort(
      (a,b)=>
        b.score - a.score
    );

    const best =
      readings[0];


    setOCRStatus(
      "Orientation trouvée. Lecture finale…",
      .82
    );

    const finalCanvas =
      buildRotatedCanvas(
        image,
        best.angle,
        2200
      );

    const finalResult =
      await TesseractLib.recognize(
        finalCanvas,
        "fra",
        {
          logger:message=>{

            if(
              message.status === "recognizing text"
              &&
              typeof message.progress === "number"
            ){

              setOCRStatus(
                "Lecture finale…",
                .82
                +
                message.progress * .16
              );
            }
          }
        }
      );

    return {
      angle:
        best.angle,
      text:
        finalResult
        &&
        finalResult.data
        ?
        String(
          finalResult.data.text
          ||
          best.text
        )
        :
        best.text
    };

  }finally{

    if(
      image
      &&
      typeof image.close === "function"
    ){
      image.close();
    }
  }
}


function extractOCRSignals(text){

  const raw =
    String(text || "");

  const normalized =
    normalizeText(raw);

  const rneMatches =
    raw
    .toUpperCase()
    .match(/\b\d{7}[A-Z]\b/g)
    ||
    [];

  const lines =
    raw
    .split(/\r?\n/)
    .map(line=>line.trim())
    .filter(Boolean);

  const postalCandidates = [];

  lines.forEach((line,lineIndex)=>{

    const matches =
      [...line.matchAll(/\b\d{5}\b/g)];

    matches.forEach(match=>{

      const value =
        match[0];

      let score = 0;

      const before =
        normalizeText(
          line.slice(
            0,
            match.index
          )
        );

      const after =
        normalizeText(
          line.slice(
            match.index
            +
            value.length
          )
        );

      if(/[A-Z]{3,}/.test(after)){
        score += 45;
      }

      if(after.includes("CEDEX")){
        score += 35;
      }

      if(
        /\b(CS|BP|TSA)\s*$/.test(before)
      ){
        score -= 100;
      }

      if(
        !/[A-Z]{3,}/.test(before)
        &&
        !/[A-Z]{3,}/.test(after)
      ){
        score -= 15;
      }

      postalCandidates.push({
        value,
        score,
        lineIndex,
        line
      });
    });
  });

  postalCandidates.sort(
    (a,b)=>
      b.score - a.score
  );

  const orderedPostalCodes =
    Array.from(
      new Set(
        postalCandidates.map(item=>item.value)
      )
    );

  const schoolMarkers =
    [
      "COLLEGE",
      "LYCEE",
      "ECOLE",
      "ETABLISSEMENT",
      "INSTITUT",
      "GROUPE SCOLAIRE",
      "CITE SCOLAIRE",
      "EREA",
      "LGT",
      "LPO",
      "LP",
      "LEGT"
    ];

  return {
    raw,
    normalized,
    lines,
    rne:
      rneMatches[0]
      ||
      "",
    postalCodes:
      orderedPostalCodes,
    postalCandidates,
    hasSchoolMarker:
      schoolMarkers.some(marker=>
        normalized.includes(
          normalizeText(marker)
        )
      )
  };
}


function usefulOCRTokens(text){

  const stopWords =
    new Set([
      "DE","DU","DES","LA","LE","LES",
      "A","AU","AUX","ET","EN","D","L",
      "M","MME","MONSIEUR","MADAME",
      "PROF","PROFESSEUR"
    ]);

  return normalizeText(text)
    .split(" ")
    .filter(Boolean)
    .filter(token=>
      token.length >= 3
      &&
      !stopWords.has(token)
    );
}


function scoreOCRCandidate(
  school,
  signals
){

  let score = 0;
  const reasons = [];

  const cp =
    String(
      school.code_postal
      ||
      ""
    );

  if(
    cp
    &&
    signals.postalCodes.includes(cp)
  ){
    score += 55;
    reasons.push("code postal");
  }


  if(
    cp
    &&
    Array.isArray(
      signals.postalCandidates
    )
  ){

    const postalEvidence =
      signals.postalCandidates.find(
        item=>
          item.value === cp
      );

    if(postalEvidence){

      score +=
        Math.max(
          -20,
          Math.min(
            35,
            postalEvidence.score / 2
          )
        );
    }
  }

  const city =
    normalizeText(
      school.nom_commune
    );

  if(
    city
    &&
    signals.normalized.includes(city)
  ){
    score += 30;
    reasons.push("ville");
  }

  const nameTokens =
    usefulOCRTokens(
      school.nom_etablissement
    );

  let nameMatches = 0;

  nameTokens.forEach(token=>{
    if(
      signals.normalized.includes(token)
    ){
      nameMatches++;
      score += 14;
    }
  });

  if(nameMatches >= 2){
    reasons.push("nom");
  }

  const address =
    [
      school.adresse_1,
      school.adresse_2,
      school.adresse_3
    ]
    .filter(Boolean)
    .join(" ");

  const addressTokens =
    usefulOCRTokens(address);

  let addressMatches = 0;

  addressTokens.forEach(token=>{
    if(
      signals.normalized.includes(token)
    ){
      addressMatches++;
      score += 8;
    }
  });

  if(addressMatches >= 2){
    reasons.push("adresse");
  }

  return {
    school,
    score,
    reasons:
      Array.from(
        new Set(reasons)
      )
  };
}


async function routeOCRSearch(
  signals,
  extractedText
){

  if(signals.rne){

    try{

      const records =
        await searchSchoolsByRNE(
          signals.rne
        );

      const exact =
        records.find(school=>
          normalizeRNE(
            school.identifiant_de_l_etablissement
            ||
            school.numero_uai
            ||
            school.uai
            ||
            ""
          )
          ===
          normalizeRNE(
            signals.rne
          )
        );

      if(exact){

        currentSearchMode =
          "PHOTO";

        currentSearchTerm =
          "Photo";

        schools = [exact];

        clearOCRStatus();

        displaySchool(
          exact
        );

        return;
      }

    }catch(error){

      console.warn(
        "RNE OCR non exploitable",
        error
      );
    }
  }


  let nameCandidates = [];

  if(signals.hasSchoolMarker){

    const ignored =
      new Set([
        "COLLEGE",
        "LYCEE",
        "ECOLE",
        "ETABLISSEMENT",
        "INSTITUT",
        "GROUPE",
        "SCOLAIRE",
        "CITE",
        "EREA",
        "LGT",
        "LPO",
        "LEGT",
        "PROF",
        "PROFESSEUR",
        "ENSEIGNANT",
        "CEDEX"
      ]);

    const tokens =
      Array.from(
        new Set(
          usefulOCRTokens(
            extractedText
          )
        )
      )
      .filter(token=>
        token.length >= 4
        &&
        !/^\d+$/.test(token)
        &&
        !ignored.has(token)
      )
      .slice(0,10);

    for(
      const token of tokens
    ){

      try{

        const found =
          await searchSchoolsDirect(
            token
          );

        nameCandidates.push(
          ...found
        );

      }catch(error){

        console.warn(
          "Recherche OCR par nom impossible",
          token,
          error
        );
      }
    }
  }


  let postalCandidatesSchools = [];

  const plausiblePostalCodes =
    (
      signals.postalCandidates
      ||
      []
    )
    .filter(item=>
      item.score > -50
    )
    .map(item=>item.value);

  const postalCodesToTry =
    Array.from(
      new Set(
        plausiblePostalCodes.length
        ?
        plausiblePostalCodes
        :
        signals.postalCodes
      )
    )
    .slice(0,3);


  for(
    const cp of postalCodesToTry
  ){

    try{

      const records =
        await fetchAllRecords(
          'code_postal="'
          +
          escapeODSQL(cp)
          +
          '"'
        );

      postalCandidatesSchools.push(
        ...records
      );

    }catch(error){

      console.warn(
        "Recherche OCR par CP impossible",
        cp,
        error
      );
    }
  }


  if(signals.hasSchoolMarker){

    const merged =
      deduplicateSchools(
        [
          ...nameCandidates,
          ...postalCandidatesSchools
        ]
      );

    const ranked =
      merged
      .map(school=>
        scoreOCRCandidate(
          school,
          signals
        )
      )
      .sort((a,b)=>
        b.score - a.score
      );


    if(ranked.length){

      const best =
        ranked[0];

      const second =
        ranked[1];

      const strong =
        best.score >= 85
        &&
        (
          !second
          ||
          best.score - second.score >= 20
        );

      lastPhotoRankedResults =
        ranked.slice(0,12);

      lastPhotoExtractedText =
        extractedText;

      schools =
        lastPhotoRankedResults.map(
          item=>item.school
        );

      clearOCRStatus();

      if(strong){

        currentSearchMode =
          "PHOTO";

        currentSearchTerm =
          "Photo";

        displaySchool(
          best.school
        );

        return;
      }

      displayOCRCandidates(
        lastPhotoRankedResults,
        extractedText
      );

      return;
    }
  }


  if(postalCodesToTry.length){

    const cp =
      postalCodesToTry[0];

    const areas =
      await searchAreas(
        cp,
        true
      );

    const exactAreas =
      areas.filter(area=>
        (area.cps || [])
        .includes(cp)
      );

    const matchingCity =
      exactAreas.find(area=>
        signals.normalized.includes(
          normalizeText(
            area.city
          )
        )
      );

    input.value =
      cp;

    updateClearButtons();

    clearOCRStatus();

    if(matchingCity){

      openCity(
        matchingCity.city,
        [cp],
        false
      );

      return;
    }

    displayAreaResults(
      exactAreas.length
      ?
      exactAreas
      :
      areas,
      true,
      cp
    );

    return;
  }


  clearOCRStatus();

  displayOCRCandidates(
    [],
    extractedText
  );
}


function displayOCRCandidates(
  ranked,
  extractedText = ""
){

  currentSearchMode =
    "PHOTO";

  currentSearchTerm =
    "Photo";

  lastPhotoRankedResults =
    ranked.slice(0,12);

  lastPhotoExtractedText =
    extractedText;

  resultList.innerHTML = "";


  if(extractedText){

    const extract =
      document.createElement("div");

    extract.className =
      "ocr-extract";

    const compactText =
      extractedText
      .replace(/\s+/g," ")
      .trim()
      .slice(0,320);

    extract.innerHTML =
      '<strong>Texte reconnu</strong>'
      +
      escapeHTML(compactText)
      +
      (
        extractedText.length > 320
        ?
        "…"
        :
        ""
      );

    resultList.appendChild(
      extract
    );
  }


  if(!ranked.length){

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "Le texte est lisible, mais aucun établissement scolaire n’a pu être identifié automatiquement.";

    resultList.appendChild(
      empty
    );

    return;
  }


  const title =
    document.createElement("div");

  title.className =
    "section-label";

  title.textContent =
    "Résultats de la photo";

  resultList.appendChild(
    title
  );


  const box =
    document.createElement("div");

  box.className =
    "list";

  ranked.forEach(item=>{

    const school =
      item.school;

    const city =
      normalizeCityForAddress(
        school.nom_commune
      );

    const div =
      document.createElement("div");

    div.className =
      "item";

    div.innerHTML =
      '<div class="item-title">'
      +
      escapeHTML(
        school.nom_etablissement
        ||
        "Établissement"
      )
      +
      '</div>'
      +
      '<div class="item-sub">'
      +
      escapeHTML(
        [
          school.type_etablissement,
          school.code_postal,
          city
        ]
        .filter(Boolean)
        .join(" · ")
      )
      +
      '</div>'
      +
      '<div class="photo-match">'
      +
      (
        item.reasons.length
        ?
        "Correspondance : "
        +
        escapeHTML(
          item.reasons.join(", ")
        )
        :
        "Correspondance probable"
      )
      +
      '</div>';

    div.onclick =
      ()=>displaySchool(
        school
      );

    box.appendChild(
      div
    );
  });

  resultList.appendChild(
    box
  );
}


async function runPhotoSearch(file){

  clearTimeout(timer);

  requestNumber++;

  input.blur();

  resultList.innerHTML = "";
  searchStatus.innerHTML = "";
  searchResultsScroller.scrollTop = 0;

  lastPhotoRankedResults = [];
  lastPhotoExtractedText = "";

  setOCRStatus(
    "Chargement du module de reconnaissance…",
    0.01
  );

  try{

    const TesseractLib =
      await loadTesseract();

    setOCRStatus(
      "Analyse de la photo…",
      0.03
    );

    const reading =
      await recognizeBestOrientation(
        file,
        TesseractLib
      );

    const extractedText =
      String(
        reading.text
        ||
        ""
      )
      .trim();

    if(
      normalizeText(
        extractedText
      ).length < 4
    ){

      setOCRStatus(
        "Aucun texte exploitable n’a été reconnu sur cette photo."
      );

      return;
    }

    setOCRStatus(
      "Texte reconnu. Recherche dans RNE EDU…",
      .99
    );

    const signals =
      extractOCRSignals(
        extractedText
      );

    await routeOCRSearch(
      signals,
      extractedText
    );

  }catch(error){

    console.error(
      "Erreur OCR",
      error
    );

    setOCRStatus(
      "Impossible d’analyser cette photo. Vérifiez la connexion puis réessayez."
    );
  }
}


/* ==================================================
   INITIALISATION
================================================== */

updateClearButtons();
updateSortButtons();
updateVisualViewport();

</script>
