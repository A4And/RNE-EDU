<script>


/* ==================================================
   API
================================================== */


const API =

"https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records";



/* ==================================================
   ELEMENTS
================================================== */


const input =

  document.getElementById(
    "searchInput"
  );


const resultList =

  document.getElementById(
    "resultList"
  );


const searchStatus =

  document.getElementById(
    "searchStatus"
  );


const schoolSearchInput =

  document.getElementById(
    "schoolSearchInput"
  );


const clearSearch =

  document.getElementById(
    "clearSearch"
  );


const clearSchoolSearch =

  document.getElementById(
    "clearSchoolSearch"
  );


const sortPostal =

  document.getElementById(
    "sortPostal"
  );


const sortName =

  document.getElementById(
    "sortName"
  );



/* ==================================================
   VARIABLES
================================================== */


let timer = null;


let requestNumber = 0;


let schools = [];


let activeFilter =
  "ALL";


let currentSearchMode =
  "";


let currentSearchTerm =
  "";


let activeSort =
  "POSTAL";


let postalAscending =
  true;


let nameAscending =
  true;



/* ==================================================
   NORMALISATION GENERALE
================================================== */


function normalizeText(text){

  return String(
    text || ""
  )

  .trim()

  .toUpperCase()

  .normalize("NFD")

  .replace(
    /[\u0300-\u036f]/g,
    ""
  )

  .replace(
    /[-'’]/g,
    " "
  )

  .replace(
    /\s+/g,
    " "
  );

}



/* ==================================================
   NORMALISATION POSTALE
================================================== */


function normalizeAddressLine(text){

  return String(
    text || ""
  )

  .trim()

  .toUpperCase()

  .normalize("NFD")

  .replace(
    /[\u0300-\u036f]/g,
    ""
  )

  .replace(
    /Œ/g,
    "OE"
  )

  .replace(
    /Æ/g,
    "AE"
  )

  .replace(
    /[^A-Z0-9 ]/g,
    " "
  )

  .replace(
    /\s+/g,
    " "
  )

  .trim();

}



/* ==================================================
   NORMALISATION VILLE POSTALE
================================================== */


function normalizeCityForAddress(city){

  const normalized =

    normalizeAddressLine(
      city
    );


  if(

    normalized.startsWith(
      "PARIS "
    )

    &&

    normalized.includes(
      "ARRONDISSEMENT"
    )

  ){

    return "PARIS";

  }


  if(

    normalized.startsWith(
      "LYON "
    )

    &&

    normalized.includes(
      "ARRONDISSEMENT"
    )

  ){

    return "LYON";

  }


  if(

    normalized.startsWith(
      "MARSEILLE "
    )

    &&

    normalized.includes(
      "ARRONDISSEMENT"
    )

  ){

    return "MARSEILLE";

  }


  return normalized;

}



/* ==================================================
   SECURITE HTML
================================================== */


function escapeHTML(value){

  return String(
    value || ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}



/* ==================================================
   SECURITE REQUETE
================================================== */


function escapeODSQL(value){

  return String(
    value || ""
  )

  .replaceAll(
    "\\",
    "\\\\"
  )

  .replaceAll(
    '"',
    '\\"'
  );

}



/* ==================================================
   NAVIGATION ECRANS
================================================== */


function activate(id){

  document

  .querySelectorAll(
    ".screen"
  )

  .forEach(

    screen =>

      screen.classList.remove(
        "active"
      )

  );


  document

  .getElementById(
    id
  )

  .classList.add(
    "active"
  );


  window.scrollTo(
    0,
    0
  );

}



/* ==================================================
   CROIX D'EFFACEMENT
================================================== */


function updateClearButtons(){

  clearSearch.style.display =

    input.value

    ?

    "flex"

    :

    "none";


  clearSchoolSearch.style.display =

    schoolSearchInput.value

    ?

    "flex"

    :

    "none";

}



clearSearch.addEventListener(

  "click",

  () => {


    clearTimeout(
      timer
    );


    requestNumber++;


    input.value =
      "";


    resultList.innerHTML =
      "";


    searchStatus.innerHTML =
      "";


    updateClearButtons();


    input.focus();


  }

);



clearSchoolSearch.addEventListener(

  "click",

  () => {


    schoolSearchInput.value =
      "";


    updateClearButtons();


    applySchoolFilters();


    schoolSearchInput.focus();


  }

);



/* ==================================================
   FILTRE SECONDAIRE
================================================== */


schoolSearchInput.addEventListener(

  "input",

  () => {


    updateClearButtons();


    applySchoolFilters();


  }

);



/* ==================================================
   RELANCE PAR ENTREE
================================================== */


input.addEventListener(

  "keydown",

  event => {


    if(

      event.key !==
      "Enter"

    ){

      return;

    }


    event.preventDefault();


    clearTimeout(
      timer
    );


    launchMainSearch();


  }

);



/* ==================================================
   SAISIE PRINCIPALE
================================================== */


input.addEventListener(

  "input",

  () => {


    clearTimeout(
      timer
    );


    updateClearButtons();


    resultList.innerHTML =
      "";


    searchStatus.innerHTML =
      "";


    const value =

      input.value.trim();


    if(
      !value
    ){

      return;

    }


    const numeric =

      /^\d+$/.test(
        value
      );


    if(

      numeric

      &&

      value.length < 2

    ){

      return;

    }


    if(

      !numeric

      &&

      value.length < 3

    ){

      return;

    }


    timer =

      setTimeout(

        () =>

          launchMainSearch(),

        300

      );


  }

);



/* ==================================================
   LANCEMENT RECHERCHE
================================================== */


function launchMainSearch(){


  const value =

    input.value.trim();


  if(
    !value
  ){

    return;

  }


  const numeric =

    /^\d+$/.test(
      value
    );


  if(

    numeric

    &&

    value.length < 2

  ){

    return;

  }


  if(

    !numeric

    &&

    value.length < 3

  ){

    return;

  }


  input.blur();


  resultList.innerHTML =
    "";


  searchStatus.innerHTML =
    "";


  smartSearch(
    value,
    numeric
  );

}



/* ==================================================
   API PAGINEE
================================================== */


async function fetchAllRecords(where){


  let records = [];


  let offset = 0;


  const limit = 100;


  while(
    true
  ){


    const params =

      new URLSearchParams();


    params.set(
      "where",
      where
    );


    params.set(
      "limit",
      String(limit)
    );


    params.set(
      "offset",
      String(offset)
    );


    const response =

      await fetch(

        API

        +

        "?"

        +

        params.toString()

      );


    if(
      !response.ok
    ){

      throw new Error(
        "API"
      );

    }


    const data =

      await response.json();


    const page =

      data.results || [];


    records.push(
      ...page
    );


    if(

      page.length < limit

    ){

      break;

    }


    offset +=
      page.length;


    if(

      offset >= 10000

    ){

      break;

    }


  }


  return records;

}



/* ==================================================
   MOTEUR PRINCIPAL
================================================== */


async function smartSearch(
  value,
  numeric
){


  const request =

    ++requestNumber;


  searchStatus.innerHTML =

    '<div class="status">Recherche…</div>';


  try{


    /* ==============================================
       CODE POSTAL
    ============================================== */


    if(
      numeric
    ){


      const areas =

        await searchAreas(
          value,
          true
        );


      if(

        request !==
        requestNumber

      ){

        return;

      }


      searchStatus.innerHTML =
        "";


      displayAreaResults(
        areas,
        true
      );


      return;


    }



    /* ==============================================
       RECHERCHE DE VILLES

       REGLE :
       TANT QU'UNE VILLE COMMENCE PAR
       LES LETTRES SAISIES,
       ON PROPOSE LES VILLES.

       AUCUNE OUVERTURE AUTOMATIQUE.
    ============================================== */


    const areas =

      await searchAreas(
        value,
        false
      );


    if(

      request !==
      requestNumber

    ){

      return;

    }



    if(

      areas.length > 0

    ){


      searchStatus.innerHTML =
        "";


      displayAreaResults(
        areas,
        false
      );


      return;


    }



    /* ==============================================
       AUCUNE VILLE TROUVEE

       ON INTERPRETE ALORS LA SAISIE
       COMME UN NOM D'ETABLISSEMENT
    ============================================== */


    const directSchools =

      await searchSchoolsDirect(
        value
      );


    if(

      request !==
      requestNumber

    ){

      return;

    }


    searchStatus.innerHTML =
      "";


    if(

      directSchools.length > 0

    ){


      openNameResults(
        value,
        directSchools
      );


      return;


    }



    resultList.innerHTML =

      '<div class="empty">Aucun résultat trouvé</div>';


  }


  catch(error){


    console.error(
      error
    );


    if(

      request ===
      requestNumber

    ){


      searchStatus.innerHTML =

        '<div class="status">Impossible d’accéder à l’annuaire.</div>';


    }


  }


}



/* ==================================================
   RECHERCHE VILLES
================================================== */


async function searchAreas(
  value,
  numeric
){


  let where;


  if(
    numeric
  ){


    where =

      'startswith(code_postal,"'

      +

      escapeODSQL(
        value
      )

      +

      '")';


  }


  else{


    where =

      'suggest(nom_commune,"'

      +

      escapeODSQL(
        value
      )

      +

      '")';


  }



  const params =

    new URLSearchParams();



  params.set(

    "select",

    "nom_commune,code_postal,count(*) as nb"

  );


  params.set(

    "group_by",

    "nom_commune,code_postal"

  );


  params.set(
    "where",
    where
  );


  params.set(

    "order_by",

    "nom_commune ASC,code_postal ASC"

  );


  params.set(
    "limit",
    "20000"
  );



  const response =

    await fetch(

      API

      +

      "?"

      +

      params.toString()

    );


  if(
    !response.ok
  ){

    throw new Error(
      "API"
    );

  }



  const data =

    await response.json();



  const map =

    new Map();



  (
    data.results || []
  )

  .forEach(

    record => {


      const city =

        String(

          record.nom_commune || ""

        )

        .trim();


      const cp =

        String(

          record.code_postal || ""

        )

        .trim();



      if(

        !city

        ||

        !cp

      ){

        return;

      }



      if(
        numeric
      ){


        if(

          !cp.startsWith(
            value
          )

        ){

          return;

        }


      }


      else{


        if(

          !normalizeText(
            city
          )

          .startsWith(

            normalizeText(
              value
            )

          )

        ){

          return;

        }


      }



      const key =

        normalizeText(
          city
        );



      if(

        !map.has(
          key
        )

      ){


        map.set(

          key,

          {

            city:
              city,

            cps:
              new Set()

          }

        );


      }



      map

      .get(
        key
      )

      .cps

      .add(
        cp
      );


    }

  );



  return Array.from(

    map.values()

  )

  .map(

    area => ({

      city:
        area.city,

      cps:

        Array.from(
          area.cps
        )

        .sort()

    })

  )

  .sort(

    (
      a,
      b
    ) =>

      a.city.localeCompare(

        b.city,

        "fr",

        {
          sensitivity:"base"
        }

      )

  );



}



/* ==================================================
   AFFICHAGE DES PROPOSITIONS DE VILLE
================================================== */


function displayAreaResults(
  areas,
  numeric
){


  resultList.innerHTML =
    "";


  if(

    areas.length === 0

  ){


    resultList.innerHTML =

      '<div class="empty">Aucune ville trouvée</div>';


    return;


  }



  const title =

    document.createElement(
      "div"
    );


  title.className =
    "section-label";


  title.textContent =

    numeric

    ?

    "Sélectionnez une ville correspondant au code postal"

    :

    "Sélectionnez une ville";



  resultList.appendChild(
    title
  );



  const box =

    document.createElement(
      "div"
    );


  box.className =
    "list";



  areas.forEach(

    area => {


      const div =

        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          area.city
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(

          area.cps.join(
            " · "
          )

        )

        +

        '</div>';



      div.onclick =

        () =>

          openCity(

            area.city,

            area.cps

          );



      box.appendChild(
        div
      );


    }

  );



  resultList.appendChild(
    box
  );


}



/* ==================================================
   RECHERCHE PAR NOM D'ETABLISSEMENT
================================================== */


async function searchSchoolsDirect(
  value
){


  const where =

    'search(nom_etablissement,"'

    +

    escapeODSQL(
      value
    )

    +

    '")';



  const records =

    await fetchAllRecords(
      where
    );



  const query =

    normalizeText(
      value
    );



  const found =

    records.filter(

      school =>

        normalizeText(

          school.nom_etablissement

        )

        .includes(
          query
        )

    );



  return deduplicateSchools(
    found
  );


}

    );

          )

      );

    schools =

      );

      error
    );

/* ==================================================
   DEDOUBLONNAGE
================================================== */


function deduplicateSchools(
  records
){


  const map =

    new Map();



  records.forEach(

    school => {


      const key =

        school.identifiant_de_l_etablissement

        ||

        school.numero_uai

        ||

        school.uai

        ||

        (

          normalizeText(

            school.nom_etablissement

          )

          +

          "|"

          +

          normalizeText(

            school.adresse_1

          )

          +

          "|"

          +

          String(

            school.code_postal || ""

          )

        );



      if(

        !map.has(
          key
        )

      ){


        map.set(
          key,
          school
        );


      }


    }

  );



  return Array.from(
    map.values()
  );


}



/* ==================================================
   CATEGORISATION
================================================== */


function schoolCategory(
  school
){


  const type =

    normalizeText(

      school.type_etablissement

    );



  if(

    type.includes(
      "COLLEGE"
    )

  ){

    return "COLLEGE";

  }



  if(

    type.includes(
      "LYCEE"
    )

  ){

    return "LYCEE";

  }



  if(

    type.includes(
      "ECOLE"
    )

    ||

    type.includes(
      "MATERNELLE"
    )

    ||

    type.includes(
      "ELEMENTAIRE"
    )

    ||

    type.includes(
      "PRIMAIRE"
    )

  ){

    return "ECOLE";

  }



  return "AUTRE";


}

/* ==================================================
   VALEUR CODE POSTAL POUR TRI
================================================== */


function postalValue(
  school
){


  const cp =

    String(

      school.code_postal || ""

    )

    .replace(
      /\D/g,
      ""
    );


  return cp

    ?

    Number(cp)

    :

    999999;


}



/* ==================================================
   COMPARATEURS DE TRI
================================================== */


function comparePostalAscending(
  a,
  b
){


  const cpA =

    postalValue(
      a
    );


  const cpB =

    postalValue(
      b
    );


  if(

    cpA !== cpB

  ){

    return cpA - cpB;

  }


  return compareNameAscending(
    a,
    b
  );


}



function comparePostalDescending(
  a,
  b
){


  const cpA =

    postalValue(
      a
    );


  const cpB =

    postalValue(
      b
    );


  if(

    cpA !== cpB

  ){

    return cpB - cpA;

  }


  return compareNameAscending(
    a,
    b
  );


}



function compareNameAscending(
  a,
  b
){


  return String(

    a.nom_etablissement || ""

  )

  .localeCompare(

    String(

      b.nom_etablissement || ""

    ),

    "fr",

    {
      sensitivity:"base"
    }

  );


}



function compareNameDescending(
  a,
  b
){


  return -

    compareNameAscending(
      a,
      b
    );


}

/* ==================================================
   CHAMP AYANT CORRESPONDU
================================================== */


function getFilterMatchInfo(
  school,
  query
){


  if(
    !query
  ){

    return null;

  }



  const rne =

    school.identifiant_de_l_etablissement

    ||

    school.numero_uai

    ||

    school.uai;



  const fields = [


    {

      kind:"NAME",

      label:"Nom",

      value:
        school.nom_etablissement

    },


    {

      kind:"CITY",

      label:"Ville",

      value:
        school.nom_commune

    },


    {

      kind:"POSTAL",

      label:"Code postal",

      value:
        school.code_postal

    },


    {

      kind:"ADDRESS",

      label:"Adresse",

      value:
        school.adresse_1

    },


    {

      kind:"ADDRESS",

      label:"Adresse",

      value:
        school.adresse_2

    },


    {

      kind:"ADDRESS",

      label:"Adresse",

      value:
        school.adresse_3

    },


    {

      kind:"TYPE",

      label:"Type",

      value:
        school.type_etablissement

    },


    {

      kind:"RNE",

      label:"RNE / UAI",

      value:
        rne

    }


  ];



  for(
    const field of fields
  ){


    if(

      field.value

      &&

      normalizeText(
        field.value
      )

      .includes(
        query
      )

    ){


      return field;


    }


  }



  return null;


}



/* ==================================================
   APPLICATION DES FILTRES
================================================== */


function applySchoolFilters(){


  const rawQuery =

    schoolSearchInput.value.trim();


  const query =

    normalizeText(
      rawQuery
    );



  let filtered =

    schools.filter(

      school => {



        if(

          activeFilter !==
          "ALL"

          &&

          schoolCategory(
            school
          )

          !==

          activeFilter

        ){


          return false;


        }



        if(
          !query
        ){


          return true;


        }



        return Boolean(

          getFilterMatchInfo(
            school,
            query
          )

        );


      }

    );



  filtered =

    filtered.slice();



  if(

    activeSort ===
    "POSTAL"

  ){


    filtered.sort(

      postalAscending

      ?

      comparePostalAscending

      :

      comparePostalDescending

    );


  }


  else{


    filtered.sort(

      nameAscending

      ?

      compareNameAscending

      :

      compareNameDescending

    );


  }



  displaySchools(
    filtered,
    rawQuery
  );


}



/* ==================================================
   AFFICHAGE LISTE ETABLISSEMENTS
================================================== */


function displaySchools(
  list,
  rawQuery = ""
){


  const container =

    document.getElementById(
      "schoolList"
    );


  const counter =

    document.getElementById(
      "schoolCounter"
    );



  container.innerHTML =
    "";



  counter.textContent =

    list.length

    +

    (

      list.length > 1

      ?

      " établissements"

      :

      " établissement"

    );



  if(

    list.length === 0

  ){


    container.innerHTML =

      '<div class="empty">Aucun établissement correspondant.</div>';


    return;


  }



  const query =

    normalizeText(
      rawQuery
    );



  list.forEach(

    school => {


      const div =

        document.createElement(
          "div"
        );


      div.className =
        "item";



      let matchHTML =
        "";



      if(
        query
      ){


        const match =

          getFilterMatchInfo(
            school,
            query
          );



        if(

          match

          &&

          match.kind !==
          "NAME"

        ){


          let displayedValue =

            String(

              match.value || ""

            );


          let matchLabel =
            "Trouvé";



          if(

            match.kind ===
            "ADDRESS"

          ){


            matchLabel =

              "Trouvé dans l’adresse";


            displayedValue =

              normalizeAddressLine(
                displayedValue
              );


          }


          else if(

            match.kind ===
            "CITY"

          ){


            matchLabel =

              "Trouvé dans la ville";


            displayedValue =

              normalizeCityForAddress(
                displayedValue
              );


          }


          else if(

            match.kind ===
            "POSTAL"

          ){


            matchLabel =

              "Trouvé dans le code postal";


          }


          else if(

            match.kind ===
            "TYPE"

          ){


            matchLabel =

              "Trouvé dans le type";


          }


          else if(

            match.kind ===
            "RNE"

          ){


            matchLabel =

              "Trouvé dans le RNE / UAI";


          }



          matchHTML =

            '<div class="match-info">'

            +

            '<strong>'

            +

            escapeHTML(
              matchLabel
            )

            +

            '</strong>'

            +

            (

              displayedValue

              ?

              '<br>'

              +

              escapeHTML(
                displayedValue
              )

              :

              ""

            )

            +

            '</div>';


        }


      }



      const city =

        normalizeCityForAddress(

          school.nom_commune

        );



      const location =

        [

          school.code_postal,

          city

        ]

        .filter(
          Boolean
        )

        .join(
          " "
        );



      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(

          school.nom_etablissement

          ||

          "Établissement"

        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(

          [

            school.type_etablissement,

            location

          ]

          .filter(
            Boolean
          )

          .join(
            " · "
          )

        )

        +

        '</div>'

        +

        matchHTML;



      div.onclick =

        () =>

          displaySchool(
            school
          );



      container.appendChild(
        div
      );


    }

  );


}



/* ==================================================
   FICHE ETABLISSEMENT
================================================== */


function displaySchool(
  school
){


  document

  .getElementById(
    "schoolName"
  )

  .textContent =

    school.nom_etablissement

    ||

    "";



  document

  .getElementById(
    "schoolType"
  )

  .textContent =

    school.type_etablissement

    ||

    "Non précisé";



  const postalCode =

    normalizeAddressLine(

      school.code_postal

    );



  const postalCityName =

    normalizeCityForAddress(

      school.nom_commune

    );



  const postalCity =

    [

      postalCode,

      postalCityName

    ]

    .filter(
      Boolean
    )

    .join(
      " "
    );



  let addressLines =

    [

      school.adresse_1,

      school.adresse_2,

      school.adresse_3

    ]

    .filter(
      Boolean
    )

    .map(

      normalizeAddressLine

    )

    .filter(
      Boolean
    );



  addressLines =

    addressLines.filter(

      (
        line,
        index,
        array
      ) =>

        array.indexOf(
          line
        )

        ===

        index

    );



  if(
    postalCity
  ){


    addressLines =

      addressLines.filter(

        line => {



          if(

            line ===
            postalCity

          ){


            return false;


          }



          if(

            line.startsWith(

              postalCity
              +
              " "

            )

            &&

            line.includes(
              "ARRONDISSEMENT"
            )

          ){


            return false;


          }



          return true;


        }

      );



    addressLines.push(
      postalCity
    );


  }



  document

  .getElementById(
    "schoolAddress"
  )

  .innerHTML =

    addressLines

    .map(
      escapeHTML
    )

    .join(
      "<br>"
    );



  document

  .getElementById(
    "schoolRNE"
  )

  .textContent =

    school.identifiant_de_l_etablissement

    ||

    school.numero_uai

    ||

    school.uai

    ||

    "Non disponible";



  activate(
    "detailScreen"
  );


}
