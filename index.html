<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>RNE EDU</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f5f7;

  color: #1d1d1f;
}


header {

  background: white;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    16px;

  border-bottom: 1px solid #e5e5e5;

  text-align: center;
}


header h1 {

  margin: 0;

  font-size: 23px;

  font-weight: 700;
}


header p {

  margin: 3px 0 0;

  font-size: 13px;

  color: #777;
}


main {

  max-width: 650px;

  margin: auto;

  padding:
    18px
    16px
    40px;
}


input {

  width: 100%;

  height: 52px;

  padding:
    0
    16px;

  font-size: 18px;

  border:
    1px solid #c7c7cc;

  border-radius: 13px;

  background: white;

  outline: none;
}


input:focus {

  border:
    2px solid #007aff;
}


.hint {

  margin:
    8px
    4px
    14px;

  color: #777;

  font-size: 13px;
}


.status {

  text-align: center;

  color: #777;

  font-size: 14px;

  padding: 15px;
}


.list {

  background: white;

  border-radius: 13px;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}


#cityList {

  max-height: 650px;
}


.item {

  padding:
    14px
    16px;

  border-bottom:
    1px solid #e5e5e5;

  cursor: pointer;
}


.item:last-child {

  border-bottom: none;
}


.item:active {

  background: #e9e9ed;
}


.item-title {

  font-size: 17px;

  font-weight: 500;
}


.item-sub {

  margin-top: 4px;

  font-size: 14px;

  color: #777;
}


.screen {

  display: none;
}


.screen.active {

  display: block;
}


.topbar {

  display: flex;

  align-items: center;

  margin-bottom: 14px;
}


.back {

  border: none;

  background: none;

  color: #007aff;

  font-size: 17px;

  padding:
    6px
    10px
    6px
    0;
}


.screen-title {

  font-size: 21px;

  font-weight: 700;

  margin: 0;
}


.city-name {

  font-size: 14px;

  color: #777;

  margin:
    3px
    0
    14px;
}


.card {

  background: white;

  border-radius: 14px;

  padding: 20px;
}


.school-name {

  margin:
    0
    0
    20px;

  font-size: 22px;

  line-height: 1.25;
}


.label {

  font-size: 12px;

  color: #777;

  text-transform: uppercase;

  margin-top: 18px;

  margin-bottom: 5px;
}


.value {

  font-size: 17px;

  line-height: 1.5;
}


.rne {

  font-size: 23px;

  font-weight: 700;

  color: #007aff;

  letter-spacing: .5px;
}


.school-search {

  margin-bottom: 12px;
}


.counter {

  font-size: 13px;

  color: #777;

  margin:
    0
    4px
    10px;
}


.cp-list {

  font-size: 14px;

  color: #777;

  margin-top: 4px;
}


.empty {

  text-align: center;

  color: #777;

  padding: 25px 15px;
}

</style>

</head>


<body>


<header>

  <h1>RNE EDU</h1>

  <p>
    Annuaire des établissements scolaires
  </p>

</header>


<main>


<!-- =================================
     ECRAN RECHERCHE
================================== -->

<section
  id="searchScreen"
  class="screen active"
>

  <input
    id="searchInput"
    type="search"
    placeholder="Ville ou code postal"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    spellcheck="false"
    inputmode="text"
  >


  <div class="hint">

    Ville : au moins 3 lettres
    ·
    Code postal : au moins 2 chiffres

  </div>


  <div
    id="searchStatus"
  ></div>


  <div
    id="cityList"
    class="list"
  ></div>


</section>



<!-- =================================
     ECRAN ETABLISSEMENTS
================================== -->

<section
  id="schoolScreen"
  class="screen"
>


  <div class="topbar">

    <button
      class="back"
      onclick="showSearch()"
    >

      ‹ Recherche

    </button>

  </div>


  <h2
    id="selectedArea"
    class="screen-title"
  ></h2>


  <div
    id="selectedAreaInfo"
    class="city-name"
  ></div>


  <input
    id="schoolSearchInput"
    class="school-search"
    type="search"
    placeholder="Rechercher un établissement"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  >


  <div
    id="schoolCounter"
    class="counter"
  ></div>


  <div
    id="schoolStatus"
    class="status"
  ></div>


  <div
    id="schoolList"
    class="list"
  ></div>


</section>



<!-- =================================
     DETAIL ETABLISSEMENT
================================== -->

<section
  id="detailScreen"
  class="screen"
>


  <div class="topbar">

    <button
      class="back"
      onclick="showSchools()"
    >

      ‹ Établissements

    </button>

  </div>


  <div class="card">


    <h2
      id="schoolName"
      class="school-name"
    ></h2>


    <div class="label">

      Adresse

    </div>


    <div
      id="schoolAddress"
      class="value"
    ></div>


    <div class="label">

      RNE / UAI

    </div>


    <div
      id="schoolRNE"
      class="rne"
    ></div>


  </div>


</section>


</main>



<script>


/*
==================================================
CONFIGURATION API
==================================================
*/


const API_BASE =
"https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records";


const input =
document.getElementById("searchInput");


const cityList =
document.getElementById("cityList");


const searchStatus =
document.getElementById("searchStatus");


const schoolSearchInput =
document.getElementById("schoolSearchInput");


let timer = null;

let requestNumber = 0;

let currentAreaName = "";

let currentPostalCodes = [];

let schools = [];



/*
==================================================
OUTILS
==================================================
*/


function normalizeText(text) {

  return String(text || "")

    .trim()

    .toUpperCase()

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}



function escapeHTML(value) {

  return String(value || "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    );

}



function escapeODSQL(value) {

  return String(value || "")

    .replaceAll(
      "\\",
      "\\\\"
    )

    .replaceAll(
      '"',
      '\\"'
    );

}



function activate(id) {

  document
    .querySelectorAll(".screen")
    .forEach(
      screen =>
        screen.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  window.scrollTo(
    0,
    0
  );

}



function titleCasePrefix(value) {

  if (!value) {
    return "";
  }


  return (
    value.charAt(0).toUpperCase()
    +
    value.slice(1).toLowerCase()
  );

}



/*
==================================================
SAISIE PRINCIPALE
==================================================
*/


input.addEventListener(
  "input",
  () => {


    clearTimeout(timer);


    const value =
      input.value.trim();


    cityList.innerHTML =
      "";


    searchStatus.innerHTML =
      "";


    if (!value) {

      return;

    }


    const numeric =
      /^\d+$/.test(value);



    /*
    ----------------------------------------
    CODE POSTAL
    ----------------------------------------
    */


    if (numeric) {


      if (
        value.length < 2
      ) {

        return;

      }


      /*
        Dès que 5 chiffres sont saisis,
        on saute directement la liste
        des communes.
      */


      if (
        value.length === 5
      ) {


        timer =
          setTimeout(
            () => {

              openPostalCode(
                value
              );

            },
            150
          );


        return;

      }


    }



    /*
    ----------------------------------------
    NOM DE VILLE
    ----------------------------------------
    */


    else {


      if (
        value.length < 3
      ) {

        return;

      }


    }



    timer =
      setTimeout(
        () => {

          searchAreas(
            value,
            numeric
          );

        },
        200
      );


  }
);



/*
==================================================
RECHERCHE DES VILLES
==================================================
*/


async function searchAreas(
  value,
  numeric
) {


  const myRequest =
    ++requestNumber;


  searchStatus.innerHTML =
    '<div class="status">Recherche…</div>';


  try {


    let where;


    if (numeric) {


      where =

        'startswith(code_postal,"'

        +

        escapeODSQL(value)

        +

        '")';


    }


    else {


      const apiValue =
        titleCasePrefix(value);


      where =

        'startswith(nom_commune,"'

        +

        escapeODSQL(apiValue)

        +

        '")';


    }



    const params =
      new URLSearchParams();


    params.set(
      "limit",
      "100"
    );


    params.set(
      "select",
      "nom_commune,code_postal"
    );


    params.set(
      "where",
      where
    );



    const url =

      API_BASE

      +

      "?"

      +

      params.toString();



    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Erreur API"
      );

    }


    const data =
      await response.json();


    if (
      myRequest !==
      requestNumber
    ) {

      return;

    }



    /*
    ----------------------------------------
    REGROUPEMENT PAR VILLE
    ----------------------------------------

    GIF-SUR-YVETTE 91190
    GIF-SUR-YVETTE 91192

    deviennent :

    GIF-SUR-YVETTE
    91190 · 91192
    ----------------------------------------
    */


    const cityMap =
      new Map();


    const results =
      data.results || [];


    results.forEach(
      record => {


        const city =
          String(
            record.nom_commune || ""
          ).trim();


        const cp =
          String(
            record.code_postal || ""
          ).trim();


        if (
          !city ||
          !cp
        ) {

          return;

        }



        /*
          Contrôle local complémentaire
        */


        if (numeric) {


          if (
            !cp.startsWith(value)
          ) {

            return;

          }


        }


        else {


          if (
            !normalizeText(city)
              .startsWith(
                normalizeText(value)
              )
          ) {

            return;

          }


        }



        const key =
          normalizeText(city);



        if (
          !cityMap.has(key)
        ) {


          cityMap.set(
            key,
            {
              city: city,
              cps: new Set()
            }
          );


        }



        cityMap
          .get(key)
          .cps
          .add(cp);


      }
    );



    let areas =
      Array.from(
        cityMap.values()
      )
      .map(
        item => {

          return {

            city:
              item.city,

            cps:
              Array.from(
                item.cps
              )
              .sort()

          };

        }
      );



    areas.sort(
      (a, b) => {

        return a.city.localeCompare(
          b.city,
          "fr",
          {
            sensitivity:
              "base"
          }
        );

      }
    );



    searchStatus.innerHTML =
      "";


    displayAreas(
      areas
    );


  }


  catch(error) {


    console.error(
      error
    );


    searchStatus.innerHTML =

      '<div class="status">' +

      'Impossible d’accéder à l’annuaire.' +

      '</div>';


  }


}



/*
==================================================
AFFICHAGE DES VILLES
==================================================
*/


function displayAreas(
  areas
) {


  cityList.innerHTML =
    "";


  if (
    areas.length === 0
  ) {


    searchStatus.innerHTML =

      '<div class="status">' +

      'Aucune ville trouvée' +

      '</div>';


    return;

  }



  areas.forEach(
    area => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          area.city
        )

        +

        '</div>'

        +

        '<div class="cp-list">'

        +

        escapeHTML(
          area.cps.join(" · ")
        )

        +

        '</div>';



      div.onclick =
        () => {


          openCity(
            area.city,
            area.cps
          );


        };


      cityList.appendChild(
        div
      );


    }
  );


}



/*
==================================================
SELECTION D'UNE VILLE
==================================================
*/


function openCity(
  city,
  postalCodes
) {


  currentAreaName =
    city;


  currentPostalCodes =
    postalCodes;


  document
    .getElementById(
      "selectedArea"
    )
    .textContent =
      city;


  document
    .getElementById(
      "selectedAreaInfo"
    )
    .textContent =
      postalCodes.join(" · ");


  schoolSearchInput.value =
    "";


  activate(
    "schoolScreen"
  );


  loadSchoolsByCity(
    city
  );

}



/*
==================================================
CODE POSTAL COMPLET :
ACCES DIRECT AUX ETABLISSEMENTS
==================================================
*/


async function openPostalCode(
  postalCode
) {


  const myRequest =
    ++requestNumber;


  cityList.innerHTML =
    "";


  searchStatus.innerHTML =

    '<div class="status">' +

    'Chargement des établissements…' +

    '</div>';


  try {


    const params =
      new URLSearchParams();


    params.set(
      "limit",
      "100"
    );


    params.set(
      "where",
      'code_postal="' +
      escapeODSQL(postalCode) +
      '"'
    );


    const url =

      API_BASE

      +

      "?"

      +

      params.toString();



    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Erreur API"
      );

    }


    const data =
      await response.json();


    if (
      myRequest !==
      requestNumber
    ) {

      return;

    }


    const records =
      data.results || [];


    if (
      records.length === 0
    ) {


      searchStatus.innerHTML =

        '<div class="status">' +

        'Aucun établissement trouvé pour ce code postal.' +

        '</div>';


      return;

    }



    const cities =
      Array.from(
        new Set(
          records
            .map(
              item =>
                item.nom_commune
            )
            .filter(Boolean)
        )
      );



    currentPostalCodes =
      [
        postalCode
      ];


    currentAreaName =

      cities.length === 1

      ?

      cities[0]

      :

      postalCode;



    document
      .getElementById(
        "selectedArea"
      )
      .textContent =

        cities.length === 1

        ?

        cities[0]

        :

        "Code postal " +
        postalCode;



    document
      .getElementById(
        "selectedAreaInfo"
      )
      .textContent =
        postalCode;



    schoolSearchInput.value =
      "";


    schools =
      deduplicateSchools(
        records
      );


    sortSchools();


    activate(
      "schoolScreen"
    );


    document
      .getElementById(
        "schoolStatus"
      )
      .textContent =
        "";


    displaySchools(
      schools
    );


  }


  catch(error) {


    console.error(
      error
    );


    searchStatus.innerHTML =

      '<div class="status">' +

      'Impossible d’accéder à l’annuaire.' +

      '</div>';


  }


}



/*
==================================================
CHARGEMENT DES ETABLISSEMENTS D'UNE VILLE
==================================================
*/


async function loadSchoolsByCity(
  city
) {


  const schoolList =
    document.getElementById(
      "schoolList"
    );


  const status =
    document.getElementById(
      "schoolStatus"
    );


  schoolList.innerHTML =
    "";


  status.textContent =
    "Chargement des établissements…";


  try {


    const apiCity =
      city;



    const params =
      new URLSearchParams();


    params.set(
      "limit",
      "100"
    );


    params.set(
      "where",

      'nom_commune="'

      +

      escapeODSQL(
        apiCity
      )

      +

      '"'
    );



    const url =

      API_BASE

      +

      "?"

      +

      params.toString();



    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Erreur API"
      );

    }


    const data =
      await response.json();


    schools =
      deduplicateSchools(
        data.results || []
      );


    /*
      Sécurité :
      on garde uniquement les CP
      trouvés pour la commune choisie.
    */


    schools =
      schools.filter(
        school =>
          currentPostalCodes.includes(
            String(
              school.code_postal || ""
            )
          )
      );


    sortSchools();


    status.textContent =
      "";


    displaySchools(
      schools
    );


  }


  catch(error) {


    console.error(
      error
    );


    status.textContent =
      "Impossible de charger les établissements.";


  }


}



/*
==================================================
DEDOUBLONNAGE
==================================================
*/


function deduplicateSchools(
  records
) {


  const unique =
    new Map();



  records.forEach(
    school => {


      const key =

        school
          .identifiant_de_l_etablissement

        ||

        school
          .numero_uai

        ||

        school
          .uai

        ||

        (

          normalizeText(
            school.nom_etablissement
          )

          +

          "|"

          +

          normalizeText(
            school.adresse_1
          )

        );



      if (
        !unique.has(key)
      ) {


        unique.set(
          key,
          school
        );


      }


    }
  );


  return Array.from(
    unique.values()
  );

}



/*
==================================================
TRI DES ETABLISSEMENTS
==================================================
*/


function sortSchools() {


  schools.sort(
    (a, b) => {


      return String(
        a.nom_etablissement || ""
      )
      .localeCompare(
        String(
          b.nom_etablissement || ""
        ),
        "fr",
        {
          sensitivity:
            "base"
        }
      );


    }
  );

}



/*
==================================================
FILTRE INSTANTANE DES ETABLISSEMENTS
==================================================
*/


schoolSearchInput.addEventListener(
  "input",
  () => {


    const query =
      normalizeText(
        schoolSearchInput.value
      );


    if (!query) {


      displaySchools(
        schools
      );


      return;

    }



    const filtered =
      schools.filter(
        school => {


          const name =
            normalizeText(
              school.nom_etablissement
            );


          const type =
            normalizeText(
              school.type_etablissement
            );


          const cp =
            normalizeText(
              school.code_postal
            );


          const address =
            normalizeText(
              school.adresse_1
            );


          return (

            name.includes(query)

            ||

            type.includes(query)

            ||

            cp.includes(query)

            ||

            address.includes(query)

          );


        }
      );



    displaySchools(
      filtered
    );


  }
);



/*
==================================================
AFFICHAGE DES ETABLISSEMENTS
==================================================
*/


function displaySchools(
  list
) {


  const container =
    document.getElementById(
      "schoolList"
    );


  const counter =
    document.getElementById(
      "schoolCounter"
    );


  container.innerHTML =
    "";


  counter.textContent =

    list.length

    +

    (
      list.length > 1
      ?
      " établissements"
      :
      " établissement"
    );



  if (
    list.length === 0
  ) {


    container.innerHTML =

      '<div class="empty">' +

      'Aucun établissement correspondant.' +

      '</div>';


    return;

  }



  list.forEach(
    school => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "item";


      const name =

        school.nom_etablissement

        ||

        "Établissement";


      const type =

        school.type_etablissement

        ||

        "";


      const cp =

        school.code_postal

        ||

        "";


      const city =

        school.nom_commune

        ||

        "";



      const subtitleParts =

        [
          type,
          [cp, city]
            .filter(Boolean)
            .join(" ")
        ]
        .filter(Boolean);



      div.innerHTML =

        '<div class="item-title">'

        +

        escapeHTML(
          name
        )

        +

        '</div>'

        +

        '<div class="item-sub">'

        +

        escapeHTML(
          subtitleParts.join(" · ")
        )

        +

        '</div>';



      div.onclick =
        () => {


          displaySchool(
            school
          );


        };


      container.appendChild(
        div
      );


    }
  );


}



/*
==================================================
DETAIL ETABLISSEMENT
==================================================
*/


function displaySchool(
  school
) {


  document
    .getElementById(
      "schoolName"
    )
    .textContent =

      school.nom_etablissement

      ||

      "";



  const addressLines =

    [

      school.adresse_1,

      school.adresse_2,

      school.adresse_3,

      [

        school.code_postal,

        school.nom_commune

      ]
      .filter(Boolean)
      .join(" ")

    ]
    .filter(Boolean);



  document
    .getElementById(
      "schoolAddress"
    )
    .innerHTML =

      addressLines

      .map(
        escapeHTML
      )

      .join(
        "<br>"
      );



  const rne =

    school
      .identifiant_de_l_etablissement

    ||

    school
      .numero_uai

    ||

    school
      .uai

    ||

    "Non disponible";



  document
    .getElementById(
      "schoolRNE"
    )
    .textContent =
      rne;



  activate(
    "detailScreen"
  );

}



/*
==================================================
NAVIGATION
==================================================
*/


function showSearch() {


  activate(
    "searchScreen"
  );


}



function showSchools() {


  activate(
    "schoolScreen"
  );


}


</script>


</body>

</html>
